<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Processes in Plants · Grade 7 Science</title>
<style>:root{--ink:#f4f2ea;--ink2:rgba(244,242,234,.78);--ink3:rgba(244,242,234,.5);--line:rgba(255,255,255,.14);
 --bio:#9be36d;--abio:#7fc4ff;--amber:#ffc35a;--red:#ff6b6b;--uv:#c39bff;--soil:#d9a878;--o2:#5fe0f0;
 --sans:-apple-system,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
 --serif:"New York","Iowan Old Style","Palatino Linotype",Georgia,serif;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#040706;color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#labels,#caps,#panels{position:fixed;inset:0;pointer-events:none}#panels>*{pointer-events:auto}#caps .cap button{pointer-events:auto}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:15}#fade.on{opacity:1}
/* chrome */
#top{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;gap:10px;padding:0 26px;z-index:20;background:linear-gradient(rgba(0,0,0,.5),transparent);transition:opacity .8s}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink2)}.brand i{width:10px;height:10px;border-radius:50%;background:var(--bio);box-shadow:0 0 14px var(--bio)}.brand span{font-weight:600;color:var(--ink)}.brand em{font-style:normal;opacity:.7;padding-left:10px;border-left:1px solid var(--line)}
.sp{flex:1}.tb{font-size:14px;letter-spacing:.04em;padding:8px 15px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink2);transition:background .2s}.tb:hover{background:rgba(255,255,255,.18);color:var(--ink)}
#nav{position:fixed;left:0;right:0;bottom:0;height:92px;display:flex;align-items:center;gap:20px;padding:0 26px 8px;z-index:20;background:linear-gradient(transparent,rgba(0,0,0,.6));transition:opacity .8s}
#nav .mid{flex:1;min-width:0}#nav .row{display:flex;justify-content:space-between;font-size:15px;color:var(--ink2);margin-bottom:10px}
#beatTitle{color:var(--ink);font-weight:500}#count{font-variant-numeric:tabular-nums;color:var(--ink3)}
#sections{display:flex;gap:6px}.sec{flex:1;min-width:0;text-align:left}.sec .bar{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden}
.sec .bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .6s cubic-bezier(.2,.7,.2,1)}.sec.cur .bar i{background:var(--amber)}
.sec .nm{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sec.cur .nm{color:var(--ink)}
.nb{width:56px;height:56px;border-radius:50%;font-size:30px;line-height:52px;background:rgba(255,255,255,.1);border:1px solid var(--line);transition:all .2s;flex:none}.nb:hover:not(:disabled){background:rgba(255,255,255,.22)}.nb:disabled{opacity:.25;cursor:default}
body.more #next{animation:nudge 2.4s infinite}@keyframes nudge{0%{box-shadow:0 0 0 0 rgba(255,195,90,.5)}70%{box-shadow:0 0 0 14px rgba(255,195,90,0)}100%{box-shadow:0 0 0 0 rgba(255,195,90,0)}}
body.idle #top,body.idle #nav{opacity:0}body.idle{cursor:none}
#idx{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:90vw;z-index:30;background:rgba(8,14,11,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .45s cubic-bezier(.2,.7,.2,1);overflow-y:auto;padding:76px 22px 30px}
#idx.open{transform:none}.ix-head{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
.ix-sec h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:600;margin:16px 0 4px}
.ix-sec button{display:block;width:100%;text-align:left;font-size:15px;color:var(--ink2);padding:6px 8px;border-radius:8px}.ix-sec button:hover{background:rgba(255,255,255,.08);color:var(--ink)}.ix-sec button.cur{color:var(--ink);background:rgba(255,195,90,.16)}
#notes{position:fixed;left:26px;bottom:104px;width:min(520px,44vw);z-index:25;background:rgba(10,16,14,.9);border:1px solid rgba(255,195,90,.4);border-radius:16px;padding:16px 20px;font-size:16px;line-height:1.5;color:var(--ink2);display:none}
#notes.on{display:block}#notes b.h{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
/* captions */
.cap{position:absolute;max-width:min(860px,86vw);opacity:0;transform:translateY(14px);filter:blur(6px);transition:opacity 1.1s cubic-bezier(.2,.7,.2,1),transform 1.3s cubic-bezier(.2,.7,.2,1),filter 1.1s;text-shadow:0 2px 30px rgba(0,0,0,.55)}
.cap.on{opacity:1;transform:none;filter:none}.cap.off{opacity:0;transform:translateY(-8px);filter:blur(4px);transition-duration:.7s}
.cap.pos-low{left:6vw;bottom:132px}.cap.pos-left{left:6vw;top:50%;transform:translate(0,-44%)}.cap.pos-left.on{transform:translate(0,-50%)}
.cap.pos-center{left:50%;top:50%;transform:translate(-50%,-40%);text-align:center;max-width:min(1200px,92vw)}.cap.pos-center.on{transform:translate(-50%,-50%)}
.cap .kick{font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--amber);font-weight:600;margin-bottom:16px}
.cap .big{font-size:clamp(42px,5.6vw,96px);font-weight:600;letter-spacing:-.025em;line-height:1.02}
.cap .mid{font-size:clamp(20px,1.85vw,30px);color:var(--ink2);line-height:1.4;margin-top:16px;text-shadow:0 1px 18px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.6)}
.cap .small{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-top:20px}
.cap .serif,.serif{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0}
.cap.compact{max-width:640px}.cap.compact .big{font-size:clamp(32px,3.4vw,56px)}.cap.compact .mid{font-size:clamp(18px,1.5vw,24px)}
.cap.def .mid{font-family:var(--serif);color:var(--ink)}.cap.stmt .big{font-size:clamp(34px,4.4vw,72px)}
.cap b.g{color:var(--bio);font-weight:600}.cap b.b{color:var(--abio);font-weight:600}.cap b.a{color:var(--amber);font-weight:600}.cap b.r{color:var(--red);font-weight:600}.cap b.s{color:var(--soil);font-weight:600}
.daycount{font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}.daycount b{font-size:52px;letter-spacing:-.02em;color:var(--ink);font-weight:600;display:inline-block;min-width:80px;font-variant-numeric:tabular-nums;vertical-align:-8px;margin-left:10px}
.steps5{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.steps5 div{width:250px;padding:16px 18px;border-radius:16px;background:rgba(10,16,14,.55);border:1px solid rgba(255,255,255,.16);text-align:left;opacity:0;transform:translateY(10px);transition:all .8s cubic-bezier(.2,.7,.2,1);backdrop-filter:blur(8px)}
.cap.on .steps5 div{opacity:1;transform:none}.cap.on .steps5 div:nth-child(2){transition-delay:.15s}.cap.on .steps5 div:nth-child(3){transition-delay:.3s}.cap.on .steps5 div:nth-child(4){transition-delay:.45s}
.steps5 div b{display:block;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--c,var(--bio));margin-bottom:6px}.steps5 div span{font-size:17px;color:var(--ink2);line-height:1.35;text-shadow:none}
.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:15px;color:var(--ink2);margin-top:14px}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.tagline{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);border-radius:99px;padding:3px 10px;vertical-align:4px;margin-left:6px}
.cap.factcard{padding:18px 20px;border-radius:16px;background:rgba(12,17,16,.8);border:1px solid rgba(255,195,90,.38);box-shadow:0 18px 50px rgba(0,0,0,.45);text-shadow:none;backdrop-filter:blur(14px)}
.cap.pos-fact{right:3.5vw;top:88px;max-width:min(420px,32vw);transform:translateY(-10px) scale(.96)}.cap.pos-fact.on{transform:none}
.factcard .fk{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);font-weight:600;display:flex;align-items:center;gap:8px}.factcard .fk i{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber)}
.factcard .ft{font-size:clamp(16px,1.2vw,20px);line-height:1.45;color:var(--ink);margin-top:8px}.factcard .ft b{color:var(--amber)}
.bigbtn{margin-top:22px;padding:14px 22px;border-radius:12px;background:rgba(255,195,90,.18);border:1px solid rgba(255,195,90,.55);font-size:17px;color:var(--ink);pointer-events:auto}.bigbtn:disabled{opacity:.45}
.sumlist{list-style:none;text-align:left;max-width:820px;margin:0 auto}.sumlist li{font-size:clamp(17px,1.45vw,23px);line-height:1.45;padding:10px 0 10px 28px;position:relative;color:var(--ink);border-bottom:1px solid var(--line)}
.sumlist li::before{content:"";position:absolute;left:4px;top:21px;width:9px;height:9px;border-radius:50%;background:var(--bio)}.sumlist b{color:var(--amber);font-weight:600}
/* labels */
.lbl{position:absolute;left:0;top:0;will-change:transform;--c:var(--ink);transition:opacity .4s}
.lbl .dot{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 24%,transparent),0 0 18px var(--c);transform:scale(0);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.lbl .stem{position:absolute;left:0;bottom:0;width:1px;background:linear-gradient(transparent,var(--c));transform-origin:bottom;transform:scaleY(0);transition:transform .6s .15s cubic-bezier(.2,.7,.2,1)}
.lbl .tx{position:absolute;left:-220px;width:440px;text-align:center;bottom:0;transform:translateY(calc(-1 * var(--lift,46px) - 6px));opacity:0;transition:opacity .6s .35s}
.lbl .tx b{display:block;font-size:16px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--c);text-shadow:0 1px 14px rgba(0,0,0,.9)}
.lbl .tx em{display:block;font-style:normal;font-size:15px;color:var(--ink2);margin-top:3px;text-shadow:0 1px 10px rgba(0,0,0,.95)}
.lbl.on .dot{transform:scale(1)}.lbl.on .stem{transform:scaleY(1)}.lbl.on .tx{opacity:1}
.lbl.down .stem{top:0;bottom:auto;transform-origin:top;background:linear-gradient(var(--c),transparent)}.lbl.down .tx{bottom:auto;top:0;transform:translateY(calc(var(--lift,46px) + 6px))}
.lbl.k-bio{--c:var(--bio)}.lbl.k-abio{--c:var(--abio)}.lbl.k-amber{--c:var(--amber)}.lbl.k-red{--c:var(--red)}.lbl.k-uv{--c:var(--uv)}.lbl.k-soil{--c:var(--soil)}
/* panels */
.panel{position:absolute;top:84px;bottom:104px;width:min(500px,40vw);background:rgba(8,13,11,.76);backdrop-filter:blur(20px) saturate(1.25);-webkit-backdrop-filter:blur(20px) saturate(1.25);border:1px solid var(--line);border-radius:20px;padding:26px;overflow-y:auto;opacity:0;transition:opacity .7s,transform .8s cubic-bezier(.2,.7,.2,1);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.panel.side-right{right:30px;transform:translateX(30px)}.panel.side-left{left:30px;transform:translateX(-30px)}.panel.side-center{left:50%;transform:translate(-50%,20px);width:min(1040px,92vw)}
.panel.on{opacity:1;transform:none}.panel.side-center.on{transform:translate(-50%,0)}.panel.auto{bottom:auto;max-height:calc(100vh - 200px)}
.panel h3{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--amber);font-weight:600;margin-bottom:10px}.panel h2{font-size:30px;font-weight:600;letter-spacing:-.015em;margin-bottom:12px;line-height:1.15}
.panel p{font-size:18px;line-height:1.55;color:var(--ink2);margin-bottom:12px}.panel p b{color:var(--ink)}
.chipbtn{display:inline-flex;align-items:center;padding:9px 15px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-size:16px;margin:6px 6px 2px 0;color:var(--ink2);transition:all .2s}.chipbtn:hover{background:rgba(255,255,255,.15);color:var(--ink)}
.chipbtn.on{background:rgba(155,227,109,.2);border-color:rgba(155,227,109,.65);color:var(--ink)}
.status{margin-top:12px;padding:13px 15px;border-radius:12px;font-size:17px;line-height:1.5;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink)}
.status.good{background:rgba(155,227,109,.12);border-color:rgba(155,227,109,.4)}.status.bad{background:rgba(255,107,107,.13);border-color:rgba(255,107,107,.45)}.status.mid{background:rgba(255,195,90,.1);border-color:rgba(255,195,90,.38)}
table.t{width:100%;border-collapse:collapse;font-size:16.5px;margin:8px 0}table.t th{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top;transition:opacity .3s}table.t td b{color:var(--ink)}
.reveal-q{margin-top:14px}.reveal-q>button{width:100%;text-align:left;padding:12px 15px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:16.5px;color:var(--ink)}
.reveal-q>button::after{content:" +";color:var(--amber)}.reveal-q .ans{display:none;padding:12px 15px 4px;font-size:17px;line-height:1.55;color:var(--ink2)}.reveal-q.open .ans{display:block;animation:fi .4s}.reveal-q.open>button::after{content:" –"}
@keyframes fi{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.eqs{font-family:var(--serif);font-size:21px;margin:12px 0;color:var(--ink)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 10px}
.panel.eqp{top:auto;bottom:120px;max-height:none}
.eqbig{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;font-size:30px;font-weight:300;margin:14px 0 8px}
.eqbig button{font-size:26px;font-weight:600;padding:10px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);transition:all .2s}.eqbig button:hover,.eqbig button.on{background:rgba(155,227,109,.2);border-color:rgba(155,227,109,.6)}
.eqbig .arrow{display:flex;flex-direction:column;align-items:center;gap:6px}.eqbig .arrow button{font-size:15px;padding:5px 12px;color:var(--amber)}.eqbig .arrow i{display:block;width:170px;height:2px;background:var(--ink);position:relative}.eqbig .arrow i::after{content:"";position:absolute;right:-2px;top:-6px;border:7px solid transparent;border-left:12px solid var(--ink)}
.score{font-size:16px;color:var(--amber);margin-left:10px;font-weight:500;letter-spacing:.04em}
.panel.practice{width:min(980px,92vw)}.qz{padding:14px 0;border-bottom:1px solid var(--line)}.qz .q{font-size:19px;margin-bottom:8px;line-height:1.45}
.qz .op{display:inline-block;text-align:left;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);margin:5px 6px 0 0;font-size:16.5px}.qz .op:hover{background:rgba(255,255,255,.12)}
.qz .op.right{border-color:var(--bio);background:rgba(155,227,109,.16)}.qz .op.wrong{border-color:var(--red);background:rgba(255,107,107,.16)}.qz .ex{display:none;font-size:15px;color:var(--ink3);margin-top:8px}.qz.done .ex{display:block}
/* microscope inset */
#scope{position:fixed;right:7vw;top:50%;width:min(44vh,520px);aspect-ratio:1;margin-top:calc(min(44vh,520px)/-2);border-radius:50%;border:2px solid rgba(255,255,255,.35);box-shadow:0 0 0 10px rgba(255,255,255,.05),0 30px 80px rgba(0,0,0,.6);opacity:0;transform:scale(.85);transition:all .9s cubic-bezier(.2,.7,.2,1);pointer-events:none;z-index:5}
#scope.on{opacity:1;transform:none}#scopeIn{width:100%;height:100%;border-radius:50%;overflow:hidden}#scopeIn img{width:100%;height:100%;display:block}#scope .sl{position:absolute;left:0;right:0;bottom:-36px;text-align:center;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
/* loader */
#loader{position:fixed;inset:0;z-index:50;background:#040706;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity 1.6s}#loader.done{opacity:0;pointer-events:none}
#loader .lt{font-size:15px;letter-spacing:.5em;text-transform:uppercase;color:var(--ink2);padding-left:.5em}#loader .lbar{width:220px;height:1px;background:rgba(255,255,255,.16)}#loader .lbar i{display:block;height:100%;width:0;background:var(--bio);transition:width .3s}#loader .ls{font-size:13px;color:var(--ink3);letter-spacing:.06em}
#nogl{position:fixed;inset:0;z-index:60;background:#0b120d;display:grid;place-items:center;text-align:center;padding:30px}#nogl[hidden]{display:none}#nogl h1{font-weight:300;letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
@media (max-width:820px){.brand em,.sec .nm{display:none}.panel{width:auto;left:12px!important;right:12px!important;top:auto;bottom:100px;max-height:48vh;transform:none!important}.cap.pos-low,.cap.pos-left{left:16px;right:16px}}
@media (prefers-reduced-motion:reduce){.cap,.lbl *{transition-duration:.01s!important}body.more #next{animation:none}}

.cap.pos-center{width:min(1200px,92vw)}
.cap .sumlist{background:rgba(8,13,11,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;padding:8px 28px;text-shadow:none}
.cap .sumlist li:last-child{border-bottom:0}
@media (max-width:900px){#top{gap:6px;padding:0 10px}.brand{display:none}.tb{font-size:12px;padding:6px 10px}#bQ,#bNotes{display:none}}

/* ---- readability pass ---- */
.cap.glass{background:linear-gradient(160deg,rgba(10,16,14,.78),rgba(10,16,14,.62));backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:28px 32px 30px;box-shadow:0 24px 70px rgba(0,0,0,.35);text-shadow:none;filter:none}
.cap.glass.on,.cap.glass.off{filter:none}
.cap.glass .mid{text-shadow:none;color:rgba(244,242,234,.86)}
.cap.glass.compact{max-width:600px}
.cap.pos-left{left:4.5vw}.cap.pos-low{left:4.5vw;bottom:118px}
.cap.pos-center::before{content:"";position:absolute;inset:-18vh -20vw;background:radial-gradient(closest-side,rgba(4,8,6,.62),rgba(4,8,6,.35) 55%,transparent);z-index:-1;pointer-events:none}
.lbl .tx{left:calc(-260px + var(--dx,0px));width:520px}
.lbl .tx .pill{display:inline-block;padding:7px 13px 8px;border-radius:12px;background:rgba(8,13,11,.8);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 8px 24px rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}
.lbl .tx b{text-shadow:none;font-size:15px}.lbl .tx em{text-shadow:none}
.lbl .stem{width:1.5px;transition:transform .6s .15s cubic-bezier(.2,.7,.2,1),height .4s}
.lbl .tx{transition:opacity .6s .35s,transform .4s}
.journey{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:26px;text-align:left}
.journey div{padding:14px;border-radius:14px;background:rgba(10,16,14,.6);border:1px solid var(--line);opacity:0;transform:translateY(10px);transition:all .7s}
.cap.on .journey div{opacity:1;transform:none}.cap.on .journey div:nth-child(2){transition-delay:.12s}.cap.on .journey div:nth-child(3){transition-delay:.24s}.cap.on .journey div:nth-child(4){transition-delay:.36s}.cap.on .journey div:nth-child(5){transition-delay:.48s}.cap.on .journey div:nth-child(6){transition-delay:.6s}
.journey b{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--c,var(--amber))}.journey em{display:block;font-style:normal;font-size:21px;font-weight:600;margin:6px 0 3px}.journey span{font-size:14.5px;color:var(--ink2);line-height:1.35}
.beyond{display:inline-block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#c9b6ff;border:1px solid rgba(201,182,255,.45);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.ncert{display:inline-block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--bio);border:1px solid rgba(155,227,109,.45);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:2px}

isabled=!0;let s=60,r=document.getElementById("thkt"),o=setInterval(()=>{s--,r&&(r.innerHTML=s>0?`Think <b>${s}</b>`:"Time\u2019s up!"),s<=0&&clearInterval(o)},1e3)})},50)}e===1&&vn(i,{pos:"center",kicker:"Guided explanation",big:"Life would collapse",html:'<div class="steps5"><div style="--c:var(--amber)"><b>No new food</b><span>Food chains begin with plants. Animals would starve.</span></div><div style="--c:var(--o2)"><b>Oxygen runs out</b><span>Oxygen used in respiration would not be replaced.</span></div><div style="--c:#c9d1d9"><b>CO\u2082 builds up</b><span>Nothing would use the carbon dioxide we release.</span></div></div>',mid:'Photosynthesis and respiration together keep the <b class="g">balance in nature</b>.'})}});Be.push({id:"nutshell",sec:"Review",title:"In a nutshell",steps:1,shot:{p:[2.2,1.1,3.4],t:[0,.4,0],fov:34,dur:4,orbit:.025},notes:"Read these together \u2014 the core of the chapter.",enter(i){ct(i,{elev:28})},step(i){vn(i,{pos:"center",kicker:"In a nutshell",html:`<ul class="sumlist">${["All living organisms require food that provides energy for growth and development.","Plants use <b>carbon dioxide</b> and <b>water</b>, in the presence of <b>sunlight</b> and <b>chlorophyll</b>, to produce <b>glucose</b> and <b>oxygen</b> \u2014 photosynthesis.","Leaves are the <b>food factories</b> of a plant.","Tiny pores called <b>stomata</b> help exchange oxygen and carbon dioxide during photosynthesis and respiration.","<b>Xylem</b> carries water and minerals from roots; <b>phloem</b> carries food from leaves to all parts.","Plants break down glucose to release energy by <b>respiration</b>, using oxygen and releasing carbon dioxide."].map(e=>`<li>${e}</li>`).join("")}</ul>`})}});var UM=[["Imagine all organisms that carry out photosynthesis disappeared. What would be the impact on living organisms?","No new food would be made, so food chains would collapse and animals would starve. Oxygen used in respiration would not be replaced, and carbon dioxide would build up. Life as we know it would end."],["A potato slice shows starch with iodine. Where does the starch come from? Where is the food made, and how does it reach the potato?","Food is made in the <b>leaves</b> by photosynthesis (as glucose). It is carried by the <b>phloem</b> to the potato, where it is <b>stored as starch</b>."],["Does the broad and flat structure of leaves make plants more efficient for photosynthesis? Justify.","Yes. A broad, flat leaf has a <b>large surface</b> to receive sunlight (and many stomata to take in carbon dioxide), so it can make more food."],["X is broken down using Y to release carbon dioxide, Z and energy. What are X, Y and Z?","X = <b>glucose</b>, Y = <b>oxygen</b>, Z = <b>water</b>. (Glucose + Oxygen \u2192 Carbon dioxide + Water + Energy.)"],["Krishna keeps one potted plant in sunlight and one in a dark room. (i) What is she testing? (ii) Visible differences? (iii) Which leaves show starch?","(i) Whether <b>sunlight</b> is needed for the plant to grow and make food. (ii) The plant in sunlight stays green and healthy; the one in the dark looks pale or yellowish and grows less. (iii) Leaves of the plant <b>in sunlight</b> turn blue-black with iodine."],["Vani\u2019s plants: (a) sunlight + CO\u2082, (b) sunlight, no CO\u2082, (c) dark + CO\u2082, (d) dark, no CO\u2082. Where is starch formed? Where is oxygen generated?","Starch is formed, and oxygen generated, only in <b>(a)</b> \u2014 it has both sunlight and carbon dioxide. Plants (b), (c) and (d) form no starch and give out no oxygen by photosynthesis."],["Ananya\u2019s four tubes: snail, water plant, snail + plant, water only, with a carbon dioxide indicator. What is she finding out?","How animals and plants change the carbon dioxide in water. The <b>snail</b> respires and adds CO\u2082; the <b>plant</b> in light uses CO\u2082 for photosynthesis; with <b>both</b>, the changes balance out; <b>water only</b> is the control. The indicator\u2019s colour change shows her if she is correct."],["Design an experiment: is water transport quicker in warm or cold conditions?","Take two similar twigs in equal amounts of red-ink water \u2014 one tumbler in <b>warm</b> water, one in <b>cold</b> water. Keep everything else the same. After a fixed time, check how far the red colour has risen in each stem and compare."],["Photosynthesis and respiration are essential to maintain balance in nature. Discuss.","Photosynthesis <b>uses carbon dioxide</b> and <b>releases oxygen</b>; respiration <b>uses oxygen</b> and <b>releases carbon dioxide</b>. Together they keep these gases in balance \u2014 like the sealed bottle garden."]];Be.push({id:"ncert",sec:"Review",title:"NCERT exercises",steps:1,shot:{p:[-1.6,.9,2.8],t:[0,.4,0],fov:34,dur:3},notes:"Discuss each question before tapping to reveal the answer.",enter(i){ct(i,{elev:30})},step(i){i.panel(`<h3>Let us enhance our learning <span class="ncert">NCERT</span></h3><h2>Think and answer</h2>${UM.map(([e,t],n)=>`<div class="qa"><div class="q"><span class="n">${n+2}</span><span>${e}</span></div><div class="reveal-q"><button onclick="this.parentNode.classList.toggle('open')">Show answer</button><div class="ans">${t}</div></div></div>`).join("")}`,{side:"center",cls:"practice"})}});var da=[["The green pigment that helps capture sunlight is:",["Starch","Chlorophyll","Iodine","Xylem"],1,"Chlorophyll is the green pigment that captures sunlight."],["A leaf with starch turns ___ with iodine.",["Red","Blue-black","Milky white","Bright green"],1,"Blue-black colour with iodine shows starch is present."],["Why do we boil the leaf in alcohol (in a water bath) first?",["To add starch","To remove the green colour so the colour change is easy to see","To make it grow","To kill germs"],1,"Decolourisation lets us easily observe the colour change."],["A variegated leaf from a plant kept in the dark for 36 hours is tested with iodine. You will see:",["Green patches turn blue-black","White patches turn blue-black","No blue-black anywhere","The whole leaf turns blue-black"],2,"Without sunlight, no starch is made \u2014 not even in green patches."],["In Activity 10.4, the half of the leaf inside the caustic soda bottle turns blue-black. True or false?",["True","False"],1,"False \u2014 caustic soda absorbs CO\u2082, so no starch forms inside."],["The tiny pores on the lower surface of a leaf are called:",["Xylem","Phloem","Stomata","Root hairs"],2,"Stomata help in the exchange of gases."],["The gas collected from a water plant in sunlight makes a matchstick burn brightly. It is rich in:",["Carbon dioxide","Nitrogen","Oxygen","Water vapour"],2,"Oxygen is released during photosynthesis."],["Which tubes carry water and minerals up from the roots?",["Phloem","Xylem","Stomata","Veins of the flower"],1,"Xylem \u2014 shown by the red ink experiment."],["A potato slice turns blue-black with iodine. Its starch came from:",["The soil","The leaves, carried by phloem","The xylem","Minerals in the roots"],1,"Food is made in leaves and carried by phloem to be stored."],["Lime water turns milky in the tube connected to germinating seeds because the seeds:",["Release oxygen","Release carbon dioxide as they respire","Release water","Absorb light"],1,"Respiring seeds give out extra carbon dioxide."],["X is broken down using Y to release carbon dioxide, Z and energy. X, Y, Z are:",["Oxygen, glucose, water","Glucose, oxygen, water","Water, CO\u2082, glucose","Starch, water, oxygen"],1,"Glucose + Oxygen \u2192 Carbon dioxide + Water + Energy."],["Only the green parts of a plant respire. True or false?",["True","False"],1,"False \u2014 all parts, green or non-green, respire."],["Vani keeps plants in (a) sun + CO\u2082, (b) sun, no CO\u2082, (c) dark + CO\u2082, (d) dark, no CO\u2082. Starch forms in:",["(a) only","(a) and (b)","(a) and (c)","All four"],0,"Photosynthesis needs both sunlight and carbon dioxide."],["Which scientist worked on coconut palm sap as a nutritive drink, Neera?",["R. H. Dastur","Kamala Sohonie","C. V. Raman","J. C. Bose"],1,"Kamala Sohonie (1911\u20131998)."],["Does the broad, flat shape of leaves help photosynthesis?",["No, shape does not matter","Yes \u2014 a larger surface receives more sunlight","Yes \u2014 it stores more water","No \u2014 it loses all its starch"],1,"A broad, flat surface captures sunlight efficiently."]];Be.push({id:"quiz",sec:"Review",title:"Quick quiz",steps:1,shot:{p:[-1.2,.7,2.4],t:[0,.4,0],fov:34,dur:3},notes:"Let students answer (hands up or teams) before clicking. Use \u2193 to scroll the panel.",enter(i){ct(i,{elev:30})},step(i){let e=0,t=0,n=i.panel(`<h3>Quick quiz <span class="score" id="qsc">0 / ${da.length}</span></h3><h2>Test yourself</h2>${da.map(([s,r,o,a],l)=>`<div class="qz" data-i="${l}"><div class="q"><b>${l+1}.</b> ${s}</div>${r.map((c,h)=>`<button class="op" data-j="${h}">${c}</button>`).join("")}<div class="ex">${a}</div></div>`).join("")}`,{side:"center",cls:"practice"});n.querySelectorAll(".qz").forEach(s=>{let[,,r]=da[+s.dataset.i];s.querySelectorAll(".op").forEach(o=>o.onclick=()=>{if(s.classList.contains("done"))return;s.classList.add("done");let a=+o.dataset.j===r;a&&e++,t++,o.classList.add(a?"right":"wrong"),s.querySelectorAll(".op")[r].classList.add("right"),n.querySelector("#qsc").textContent=`${e} / ${da.length}`+(t===da.length?" \xB7 finished!":"")})})}});Be.push({id:"end",sec:"Review",title:"Every plant is a living system",steps:1,from:{p:[.6,.4,1],t:[0,.4,0],fov:30},shot:{p:[-7,4,12],t:[0,1,0],fov:40,dur:12},notes:"Close the lesson. Homework idea: start a bottle garden, or design the warm-vs-cold water transport experiment (textbook Q9).",cut:!0,enter(i){ct(i,{elev:12,az:240})},step(i){vn(i,{pos:"center",cls:"stmt",kicker:"Remember",big:"Every leaf is a tiny food factory.<br>Every root is a gateway.<br>Every plant is a living system.",small:"Life Processes in Plants \xB7 Grade 7 Science"})}});var ps=i=>document.querySelector(i),Hc=i=>{ps("#lbarI").style.width=i*100+"%"},pa=()=>new Promise(i=>setTimeou
