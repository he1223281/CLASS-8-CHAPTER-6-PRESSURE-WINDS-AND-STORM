<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Processes in Plants</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap">
<style>
:root{
  --bg:#EAF5FF; --bg2:#F5FAFF; --white:#FFFFFF; --ink:#142B45; --ink2:#4A5F78; --line:#D3E3F3;
  --green:#239B56; --green2:#1C7C45; --lgreen:#DFF5E5; --blue:#3988E8; --lblue:#E3EFFD;
  --sun:#FFD166; --lsun:#FFF4D6; --o2:#4FD1E3; --co2:#97A1AC; --water:#3B8EEA;
  --food:#F2A33A; --starch:#1F2347; --iodine:#B9782F; --red:#E0475B; --lred:#FDE7EA;
  --shadow:0 18px 50px rgba(20,43,69,.10),0 3px 10px rgba(20,43,69,.06);
  --font:"Inter","Aptos","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#D8EAFB;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
#stage{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(1400px 800px at 85% -10%,#FFFFFF 0%,rgba(255,255,255,0) 60%),linear-gradient(180deg,#EAF5FF 0%,#E4F2FF 100%)}
#slides{position:absolute;inset:0 0 96px 0}
.slide{position:absolute;inset:0;padding:54px 90px 26px;display:none}
.slide.active{display:block}
.slide:not(.active) *{animation-play-state:paused!important}
.slide.in-fwd{animation:inFwd .7s cubic-bezier(.2,.8,.2,1)}
.slide.in-back{animation:inBack .6s cubic-bezier(.2,.8,.2,1)}
.slide.in-zoom{animation:inZoom 1s cubic-bezier(.2,.8,.2,1)}
@keyframes inFwd{from{opacity:0;transform:translateX(60px) scale(.985)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes inZoom{from{opacity:0;transform:scale(1.18);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}

/* typography */
.kicker{display:inline-flex;align-items:center;gap:12px;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.kicker:before{content:"";width:34px;height:4px;border-radius:4px;background:var(--green)}
h1{font-size:120px;line-height:1;font-weight:800;letter-spacing:-.03em}
h2.t{font-size:60px;line-height:1.08;font-weight:800;letter-spacing:-.02em;margin:10px 0 26px}
h3{font-size:36px;font-weight:750;letter-spacing:-.01em}
p,li{font-size:30px;line-height:1.38}
.muted{color:var(--ink2)}
b,strong{font-weight:750}
.g{color:var(--green)} .bl{color:var(--blue)} .rd{color:var(--red)} .fd{color:#C67A12}
sub{font-size:.65em}
.big{font-size:38px;line-height:1.3}

/* layout */
.row{display:flex;gap:28px;align-items:center}
.col{display:flex;flex-direction:column;gap:22px}
.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:44px;height:790px}
.grid2.even{grid-template-columns:1fr 1fr}
.grid2.wideR{grid-template-columns:1fr 1.25fr}
.fill{height:100%}
.card{background:var(--white);border-radius:30px;box-shadow:var(--shadow);padding:28px 34px}
.card.soft{background:rgba(255,255,255,.75);backdrop-filter:blur(8px)}
.card.green{background:var(--lgreen)} .card.blue{background:var(--lblue)} .card.sun{background:var(--lsun)}
.viz{background:var(--white);border-radius:34px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.viz>svg{display:block;width:100%;height:100%}
.pill{display:inline-flex;align-items:center;gap:10px;padding:8px 20px;border-radius:999px;font-size:24px;font-weight:700;background:var(--lblue);color:var(--blue)}
.pill.g{background:var(--lgreen);color:var(--green)}
.pill.y{background:var(--lsun);color:#9A6A00}
.list{list-style:none;display:flex;flex-direction:column;gap:16px}
.list li{position:relative;padding-left:44px}
.list li:before{content:"";position:absolute;left:6px;top:13px;width:18px;height:18px;border-radius:50%;background:var(--green);box-shadow:0 0 0 6px var(--lgreen)}
.q{display:flex;gap:22px;align-items:center;background:linear-gradient(90deg,#FFF6DD,#FFFDF6);border:2px solid #FFE3A0;border-radius:26px;padding:22px 30px;font-size:34px;font-weight:700}
.q .qm{flex:none;width:58px;height:58px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:36px;font-weight:900;color:#7A5200}
.caution{display:flex;gap:18px;align-items:flex-start;background:#FFF0EC;border:2px solid #FFC2B4;border-radius:22px;padding:18px 24px;font-size:26px;line-height:1.35;color:#8A2A12}
.caution svg{flex:none;width:44px;height:44px}
.concl{background:linear-gradient(135deg,#239B56,#2FB463);color:#fff;border-radius:28px;padding:26px 34px;font-size:32px;line-height:1.35;font-weight:600;box-shadow:0 18px 40px rgba(35,155,86,.25)}
.concl b{color:#FFF3C4}
.fact{background:linear-gradient(135deg,#F3ECFF,#FFFFFF);border:2px solid #E1D2FF;border-radius:26px;padding:24px 30px}
.fact .tag{font-size:22px;font-weight:800;letter-spacing:.12em;color:#7A4CD9;text-transform:uppercase;margin-bottom:8px}

/* reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.rv.on{opacity:1;transform:none;pointer-events:auto}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:12px;font-size:27px;font-weight:700;padding:16px 30px;border-radius:999px;background:var(--white);color:var(--ink);box-shadow:0 6px 18px rgba(20,43,69,.10),inset 0 0 0 2px var(--line);transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,43,69,.14),inset 0 0 0 2px #BFD6EE}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--green);color:#fff;box-shadow:0 10px 24px rgba(35,155,86,.3)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 10px 24px rgba(57,136,232,.3)}
.btn.sel{background:var(--ink);color:#fff;box-shadow:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{font-size:22px;padding:10px 20px}
.seg{display:inline-flex;background:#fff;border-radius:999px;padding:6px;box-shadow:inset 0 0 0 2px var(--line)}
.seg button{font-size:25px;font-weight:700;padding:12px 26px;border-radius:999px;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}

/* stepper */
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:18px;align-items:flex-start;padding:16px 20px;border-radius:20px;font-size:27px;line-height:1.3;color:var(--ink2);transition:all .35s}
.step .n{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#E9F0F8;font-weight:800;font-size:22px;color:var(--ink2)}
.step.on{background:var(--white);color:var(--ink);box-shadow:var(--shadow)}
.step.on .n{background:var(--green);color:#fff}
.step.done .n{background:var(--lgreen);color:var(--green)}

/* tables */
table.tb{width:100%;border-collapse:separate;border-spacing:0;font-size:26px;background:#fff;border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.tb th{background:var(--ink);color:#fff;font-weight:700;padding:16px 18px;text-align:left;font-size:24px}
.tb td{padding:16px 18px;border-top:1px solid #E6EEF7;vertical-align:middle}
.tb tr:nth-child(even) td{background:#F7FBFF}
.cell-hide{cursor:pointer;color:transparent!important;position:relative}
.cell-hide:after{content:"tap";position:absolute;inset:8px;border-radius:12px;background:repeating-linear-gradient(45deg,#E9F2FC,#E9F2FC 10px,#F4F8FD 10px,#F4F8FD 20px);color:#8AA2BD;font-size:18px;display:grid;place-items:center;font-weight:700}
.yes{color:var(--green);font-weight:800} .no{color:var(--red);font-weight:800}

/* svg helpers */
.lbl{font-family:var(--font);font-weight:700;fill:var(--ink)}
.lbl-w{font-family:var(--font);font-weight:700;fill:#fff}
.spin{animation:spin 40s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.sway{animation:sway 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(1.4deg)}}
.flick{animation:flick .18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scaleY(1.12) scaleX(.92)}}
.dash{stroke-dasharray:14 14;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.fadein{animation:fadeIn .8s ease both}
@keyframes fadeIn{from{opacity:0}}
.glowleaf{animation:glowleaf 2.2s ease-in-out infinite}
@keyframes glowleaf{50%{filter:drop-shadow(0 0 26px rgba(255,209,102,.95)) brightness(1.08)}}

/* chrome */
#bar{position:absolute;left:0;right:0;bottom:0;height:96px;display:flex;align-items:center;gap:14px;padding:0 28px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-top:1px solid rgba(20,43,69,.06);z-index:20}
#prog{position:absolute;left:0;top:-1px;height:5px;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:0 4px 4px 0;transition:width .5s}
.cb{display:inline-flex;align-items:center;gap:10px;height:62px;padding:0 20px;border-radius:18px;font-size:22px;font-weight:700;color:var(--ink);transition:background .2s}
.cb:hover{background:#EEF5FD}
.cb svg{width:28px;height:28px}
.cb.nav{background:var(--ink);color:#fff;padding:0 28px}
.cb.nav:hover{background:#1E3B5E}
.cb.nav.next{background:var(--green)}
.cb.nav.next:hover{background:var(--green2)}
#count{font-size:24px;font-weight:800;min-width:120px;text-align:center;font-variant-numeric:tabular-nums}
#secname{font-size:22px;font-weight:700;color:var(--ink2);flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stepdots{display:flex;gap:6px;min-width:60px}
#stepdots i{width:10px;height:10px;border-radius:50%;background:#C9D9EA}
#stepdots i.on{background:var(--green)}
#toc{position:absolute;top:0;left:0;bottom:96px;width:560px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);box-shadow:30px 0 60px rgba(20,43,69,.15);transform:translateX(-105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:30;display:flex;flex-direction:column}
#toc.open{transform:none}
#toc header{padding:34px 34px 18px;display:flex;align-items:center;justify-content:space-between}
#toc header h3{font-size:30px}
#toclist{overflow:auto;padding:0 20px 30px}
.tsec{font-size:18px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green);padding:18px 16px 6px}
.titem{display:flex;gap:14px;width:100%;text-align:left;padding:11px 16px;border-radius:14px;font-size:22px;font-weight:600;color:var(--ink2)}
.titem span{color:#9AB0C7;font-variant-numeric:tabular-nums;min-width:30px}
.titem:hover{background:#EEF5FD;color:var(--ink)}
.titem.cur{background:var(--lgreen);color:var(--green2)}
#notes{position:absolute;right:28px;bottom:112px;width:620px;background:#142B45;color:#fff;border-radius:24px;padding:24px 28px;font-size:23px;line-height:1.45;box-shadow:0 20px 50px rgba(0,0,0,.25);z-index:25;display:none}
#notes.open{display:block}
#notes h4{font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--sun);margin-bottom:8px}
#scrim{position:absolute;inset:0;background:rgba(20,43,69,.18);z-index:29;opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}

/* quiz */
.qz-opts{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.qz-opt{display:flex;align-items:center;gap:18px;text-align:left;font-size:29px;font-weight:650;padding:22px 26px;border-radius:22px;background:#fff;box-shadow:inset 0 0 0 3px var(--line);transition:all .2s;line-height:1.25}
.qz-opt:hover{box-shadow:inset 0 0 0 3px var(--blue)}
.qz-opt .k{flex:none;width:48px;height:48px;border-radius:14px;background:var(--lblue);color:var(--blue);display:grid;place-items:center;font-weight:800}
.qz-opt.right{background:#E3F7EA;box-shadow:inset 0 0 0 3px var(--green)}
.qz-opt.right .k{background:var(--green);color:#fff}
.qz-opt.wrong{background:#FDECEE;box-shadow:inset 0 0 0 3px var(--red)}
.qz-opt.wrong .k{background:var(--red);color:#fff}
.qz-opt.dim{opacity:.5}
.qz-locked .qz-opt{pointer-events:none}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:16px 60px}
.mt button{font-size:27px;font-weight:700;padding:18px 22px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 3px var(--line);text-align:left}
.mt button.pick{box-shadow:inset 0 0 0 3px var(--blue);background:var(--lblue)}
.mt button.ok{box-shadow:inset 0 0 0 3px var(--green);background:#E3F7EA;pointer-events:none}
.mt button.bad{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{display:flex;gap:24px;align-items:center;border-radius:26px;padding:22px 28px;font-size:27px;line-height:1.38}
.fb.ok{background:#E3F7EA} .fb.bad{background:#FDECEE}
.fb svg{flex:none}

/* opening */
#startbtn{font-size:34px;padding:24px 46px;border-radius:999px;background:var(--green);color:#fff;font-weight:800;box-shadow:0 18px 40px rgba(35,155,86,.35),0 0 0 0 rgba(35,155,86,.5);animation:ring 2.4s infinite;display:inline-flex;gap:16px;align-items:center}
@keyframes ring{70%{box-shadow:0 18px 40px rgba(35,155,86,.35),0 0 0 26px rgba(35,155,86,0)}100%{box-shadow:0 18px 40px rgba(35,155,86,.35),0 0 0 0 rgba(35,155,86,0)}}
.zoomout{transition:transform 1.3s cubic-bezier(.6,0,.2,1),opacity 1.3s;transform:scale(4.2);opacity:0}
.mote{animation:mote linear infinite}
@keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(60px,-220px);opacity:0}}
.clk{cursor:pointer}
.clk:hover{filter:brightness(1.04) drop-shadow(0 6px 14px rgba(20,43,69,.18))}
.slide.full{padding:0}
.bubble{position:relative;background:#fff;border-radius:30px;padding:26px 30px;font-size:29px;line-height:1.35;box-shadow:var(--shadow)}
.kid{display:flex;gap:22px;align-items:flex-start}
.kid svg{flex:none}
.chip{position:absolute;padding:10px 20px;border-radius:999px;background:#fff;box-shadow:var(--shadow);font-size:24px;font-weight:750;opacity:0;transform:scale(.8);transition:all .5s cubic-bezier(.3,1.6,.5,1)}
.chip.on{opacity:1;transform:none}
.ctrls{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.overlay{position:absolute}
.hl{background:linear-gradient(transparent 60%,#FFE7A3 60%)}

.btn svg,.row svg,.q svg{flex:none}
.col>.pill,.col>.pill.g{align-self:flex-start}
.eqb{white-space:nowrap}
.card>svg{flex:none}

</style>
</head>
<body>

 <linearGradient id="gLeaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4CC97E"/><stop offset="1" stop-color="#1E8A4C"/></linearGradient>

 <linearGradient id="gStem" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2E9C57"/><stop offset=".5" stop-color="#5BC783"/><stop offset="1" stop-color="#24804A"/></linearGradient>
 <linearGradient id="gTrunk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6B4428"/><stop offset=".45" stop-color="#9A6A42"/><stop offset="1" stop-color="#5A381F"/></linearGradient>
 <linearGradient id="gSoil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8C6239"/><stop offset="1" stop-color="#5E3F22"/></linearGradient>
 <linearGradient id="gPot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9573A"/><stop offset=".4" stop-color="#DE7E55"/><stop offset="1" stop-color="#A84B30"/></linearGradient>

 <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FD0FF" stop-opacity=".75"/><stop offset="1" stop-color="#4C9BEA" stop-opacity=".8"/></linearGradient>
 <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8CC8FF"/><stop offset=".6" stop-color="#CFE8FF"/><stop offset="1" stop-color="#F1F9FF"/></linearGradient>
 <linearGradient id="gShaft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6D0" stop-opacity=".85"/><stop offset="1" stop-color="#FFF6D0" stop-opacity="0"/></linearGradient>
 <linearGradient id="gRay" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD166" stop-opacity=".95"/><stop offset="1" stop-color="#FFD166" stop-opacity=".1"/></linearGradient>
 <radialGradient id="gSun"><stop offset="0" stop-color="#FFFBE6"/><stop offset=".45" stop-color="#FFE38A"/><stop offset="1" stop-color="#FFC43D"/></radialGradient>
 <radialGradient id="gSunGlow"><stop offset="0" stop-color="#FFE9A6" stop-opacity=".9"/><stop offset="1" stop-color="#FFE9A6" stop-opacity="0"/></radialGradient>
 <radialGradient id="gCanopy" cx=".35" cy=".3"><stop offset="0" stop-color="#7FE0A3"/><stop offset=".55" stop-color="#2FAE62"/><stop offset="1" stop-color="#17703D"/></radialGradient>
 <radialGradient id="gCell" cx=".4" cy=".35"><stop offset="0" stop-color="#F4FFF6"/><stop offset="1" stop-color="#CDEFD7"/></radialGradient>
 <radialGradient id="gVig"><stop offset=".72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
 <filter id="fShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#142B45" flood-opacity=".18"/></filter>
 <filter id="fGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="fBlur"><feGaussianBlur stdDeviation="8"/></filter>
 <marker id="mArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker>
</defs></svg>
<div id="stage">
  <div id="slides"></div>
  <div id="scrim"></div>
  <aside id="toc" aria-label="Table of contents"><header><h3>Chapter map</h3><button class="cb" id="tocx" aria-label="Close">✕</button></header><div id="toclist"></div></aside>
  <div id="notes"><h4>Teacher note</h4><div id="notetext"></div></div>
  <nav id="bar">
    <div id="prog"></div>
    <button class="cb" id="b-toc" title="Contents (C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Contents</button>
    <button class="cb" id="b-home" title="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Home</button>
    <div id="secname"></div>
    <div id="stepdots"></div>
    <button class="cb nav" id="b-prev" title="Previous (←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Back</button>
    <div id="count">1 / 1</div>
    <button class="cb nav next" id="b-next" title="Next (→ or Space)">Next<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>

 },
 /* potted / ground plant. g=growth 0..1, droop 0..1, col leaf colour, thin */
 plant(x,y,o={}){
  const g=o.g??.5,droop=o.droop||0,col=o.col||null,H=o.H||520,thin=o.thin||0;

    for(let j=1;j<=3;j++){const tt=j/3.2;s+=ART.leaf(bx+(ex-bx)*tt,by+(ey-by)*tt,55*bg+10,20*bg+5,(sd>0?-50:-130)+(j%2?-30:30)*sd+droop*(sd>0?60:-60),lf,col?mix(col,'#ffffff',.4):'#BFF0D0');}

/* Particles that travel along an SVG path */
class Flow{
 constructor(path,o={}){
  this.path=path;this.o=Object.assign({n:10,r:8,kind:'water',speed:.18,jitter:0,fade:.12,dir:1},o);
  this.g=svgEl('g',{'pointer-events':'none'});(o.into||path.parentNode).appendChild(this.g);
  const R=rng(o.seed||7);this.ps=[];
  for(let i=0;i<this.o.n;i++){const e=svgEl('g',{},this.g);e.innerHTML=ART.mol(this.o.kind,this.o.r);this.ps.push({e,u:i/this.o.n,j:(R()-.5)*this.o.jitter,s:.85+R()*.3});}
  this.on=o.on!==false;this.alpha=this.on?1:0;this.len=0;
 }
 set(v){this.on=v;}
 tick(dt){
  if(!this.len)this.len=this.path.getTotalLength();
  this.alpha=clamp(this.alpha+(this.on?dt*2.5:-dt*2.5),0,1);this.g.style.opacity=this.alpha;
  if(this.alpha<=0)return;
  const L=this.len,f=this.o.fade;
  for(const p of this.ps){p.u=(p.u+dt*this.o.speed*p.s)%1;const u=this.o.dir>0?p.u:1-p.u;const pt=this.path.getPointAtLength(u*L);
   const a=Math.min(1,p.u/f,(1-p.u)/f);p.e.setAttribute('transform',`translate(${pt.x+p.j} ${pt.y+p.j*.5})`);p.e.setAttribute('opacity',a.toFixed(2));}
 }
}

/* ============ slide registry & navigation ============ */
const SLIDES=[];const S=o=>SLIDES.push(o);
const APP={i:0,step:0,max:0,els:[]};
function maxStep(el,o){let m=o.steps||0;$$('[data-s]',el).forEach(e=>m=Math.max(m,+e.dataset.s));return m;}
function applyStep(){
 const el=APP.els[APP.i],o=SLIDES[APP.i];
 $$('[data-s]',el).forEach(e=>e.classList.toggle('on',+e.dataset.s<=APP.step));
 if(o.onStep)o.onStep(el,APP.step,o);
 const d=$('#stepdots');d.innerHTML='';for(let k=1;k<=APP.max;k++){const i=document.createElement('i');if(k<=APP.step)i.className='on';d.appendChild(i);}
}
function build(){
 const box=$('#slides');box.innerHTML='';APP.els=[];
 SLIDES.forEach((o,i)=>{const el=document.createElement('section');el.className='slide'+(o.cls?' '+o.cls:'');el.id='s-'+o.id;
  el.innerHTML=(o.bare?'':`<div class="kicker">${o.sec}</div><h2 class="t">${o.head||o.title}</h2>`)+o.html;
  box.appendChild(el);APP.els.push(el);o._bag=Bag();if(o.init)o.init(el,o);});
 const tl=$('#toclist');tl.innerHTML='';let last='';
 SLIDES.forEach((o,i)=>{if(o.sec!==last){last=o.sec;const h=document.createElement('div');h.className='tsec';h.textContent=o.sec;tl.appendChild(h);}
  const b=document.createElement('button');b.className='titem';b.innerHTML=`<span>${i+1}</span>${o.title}`;b.onclick=()=>{go(i);toc(false)};tl.appendChild(b);});
}
function go(i,dir,showAll){
 i=clamp(i,0,SLIDES.length-1);const prev=APP.els[APP.i],po=SLIDES[APP.i];
 if(prev&&prev.classList.contains('active')&&po){po._bag.clear();if(po.leave)po.leave(prev,po);prev.classList.remove('active','in-fwd','in-back','in-zoom');}
 APP.i=i;const el=APP.els[i],o=SLIDES[i];
 el.classList.add('active',o.zoom&&dir!=='back'?'in-zoom':dir==='back'?'in-back':'in-fwd');
 APP.max=maxStep(el,o);APP.step=showAll?APP.max:0;
 if(o.enter)o.enter(el,o);applyStep();
 $('#count').textContent=`${i+1} / ${SLIDES.length}`;$('#secname').textContent=o.sec+'  ·  '+o.title;
 $('#prog').style.width=((i+1)/SLIDES.length*100)+'%';
 $('#notetext').innerHTML=o.notes||'Let students observe and discuss before you click Next.';
 $$('.titem').forEach((b,k)=>b.classList.toggle('cur',k===i));
 try{history.replaceState(null,'','#'+(i+1))}catch(e){}
}
function next(){const o=SLIDES[APP.i];if(o.onNext&&o.onNext(APP.els[APP.i],o))return;if(APP.step<APP.max){APP.step++;applyStep();}else if(APP.i<SLIDES.length-1)go(APP.i+1,'fwd');}
function prev(){if(APP.step>0){APP.step--;applyStep();}else if(APP.i>0)go(APP.i-1,'back',true);}
function toc(v){$('#toc').classList.toggle('open',v);$('#scrim').classList.toggle('on',v);}
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`;}
function fullscreen(){const d=document;if(!d.fullscreenElement&&!d.webkitFullscreenElement){const r=d.documentElement;(r.requestFullscreen||r.webkitRequestFullscreen).call(r).catch?.(()=>{});}else{(d.exitFullscreen||d.webkitExitFullscreen).call(d);}}
function restart(){SLIDES[APP.i]._bag.clear();if(SLIDES[APP.i].leave)SLIDES[APP.i].leave(APP.els[APP.i],SLIDES[APP.i]);APP.els[APP.i].classList.remove('active');APP.i=0;build();go(0);}
function boot(){
 build();fit();addEventListener('resize',fit);
 $('#b-next').onclick=next;$('#b-prev').onclick=prev;$('#b-home').onclick=()=>go(0,'back');
 $('#b-toc').onclick=()=>toc(!$('#toc').classList.contains('open'));$('#tocx').onclick=()=>toc(false);$('#scrim').onclick=()=>toc(false);
 $('#b-notes').onclick=()=>$('#notes').classList.toggle('open');$('#b-full').onclick=fullscreen;
 $('#b-restart').onclick=()=>{if(confirm('Restart the presentation from the beginning? (Quiz score will be reset.)'))restart();};
 const fsc=()=>{$('#fulltxt').textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'Exit full':'Fullscreen';};
 document.addEventListener('fullscreenchange',fsc);document.addEventListener('webkitfullscreenchange',fsc);
 addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.altKey||e.ctrlKey||e.metaKey)return;
  const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'&&e.target===document.body){e.preventDefault();next();}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
  else if(k==='Home'){go(0,'back');}else if(k==='End'){go(SLIDES.length-1);}
  else if(k==='f'||k==='F'){fullscreen();}else if(k==='n'||k==='N'){$('#notes').classList.toggle('open');}
  else if(k==='c'||k==='C'){toc(!$('#toc').classList.contains('open'));}
  else if(k==='Escape'){toc(false);$('#notes').classList.remove('open');}
 });
 /* buttons inside slides should not steal Space/Enter focus */
 document.addEventListener('mouseup',()=>{const a=document.activeElement;if(a&&a.tagName==='BUTTON')a.blur();});
 let last=performance.now();(function loop(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;const o=SLIDES[APP.i];if(o&&o.tick)o.tick(dt,ts/1000,APP.els[APP.i],o);requestAnimationFrame(loop);})(last);
 const h=parseInt(location.hash.slice(1));go(h>0?h-1:0);
}

  for(let i=0;i<70;i++){const a=R()*Math.PI*2,d=.5+R()*.5;t+=ART.leaf(1370+Math.cos(a)*d*430,330+Math.sin(a)*d*280,34+R()*18,13,R()*360,R()>.5?'#2FB463':'#7BDA9C','#BFF0D0');}
  for(let i=0;i<26;i++){t+=`<circle cx="${1250+R()*260}" cy="${140+R()*170}" r="${18+R()*30}" fill="#B6F0C8" opacity="${.25+R()*.3}"/>`;}
  t+='</g>';$('#optree',el).innerHTML=t;
  let gr='';for(let i=0;i<90;i++){const x=R()*1920,y=870+R()*110,hh=20+R()*36;gr+=`<path d="M${x} ${y}q${-6+R()*4} ${-hh*.6} ${-4+R()*14} ${-hh}M${x+4} ${y}q4 ${-hh*.5} ${10} ${-hh*.8}" stroke="${R()>.5?'#3FA765':'#2E8F52'}" stroke-width="4" fill="none" stroke-linecap="round"/>`;}
  for(let i=0;i<14;i++){const x=80+R()*1100,y=900+R()*60;gr+=`<g transform="translate(${x} ${y})">${[0,72,144,216,288].map(a=>`<ellipse rx="7" ry="12" cy="-10" fill="${i%3?'#FFFFFF':'#FFD166'}" transform="rotate(${a})"/>`).join('')}<circle r="6" fill="#F2A33A"/></g>`;}
  $('#opgrass',el).innerHTML=gr;
  let m='';for(let i=0;i<46;i++){m+=`<circle cx="${700+R()*1200}" cy="${200+R()*700}" r="${2+R()*4}" fill="#FFF6C8" class="mote" style="animation-duration:${7+R()*9}s;animation-delay:-${R()*12}s"/>`;}
  $('#opmotes',el).innerHTML=m;

 },

/* ===================== SCENE 2c — ACTIVITY 10.1 THREE POTS ===================== */
S({id:'pots',sec:'10.1 How do plants grow?',title:'Activity 10.1 — Three pots',head:'Activity 10.1: Three pots',
 notes:'Click each pot to discuss its conditions. Let every student choose a prediction before pressing <b>Fast-forward 2 weeks</b>. The real experiment needs two weeks — plan ahead and keep a daily record.',

  const P=[{k:'A',sun:1,wat:1,bg:'url(#gSky)',end:{g:.66}},{k:'B',sun:1,wat:0,bg:'url(#gSky)',end:{g:.28,droop:1,col:'#A8834A'}},{k:'C',sun:0,wat:1,bg:'#1C2B45',end:{g:.40,col:'#CDD46A',thin:1}}];

   s+=`<g class="clk" id="pp${p.k}" style="transform-origin:${x+280}px 235px;transition:transform .4s"><rect x="${x}" y="0" width="560" height="470" rx="28" fill="${p.bg}"/>`;

   s+=`<text x="${x+34}" y="64" font-size="40" font-weight="800" class="${p.sun?'lbl':'lbl-w'}">Pot ${p.k}</text>`;
   if(p.wat)s+=`<g transform="translate(${x+90} 120)"><path d="M0 30h60l16-14 8 6-14 18v26H0z" fill="#3988E8"/><path d="M0 30Q-20 30-20 50" stroke="#3988E8" stroke-width="8" fill="none"/>${[0,1,2].map(j=>`<path d="M92 ${30+j*6}c-4 6-6 9-6 12a6 6 0 0012 0c0-3-2-6-6-12z" fill="#3B8EEA" class="mote" style="animation:dropf 1.4s ${j*.45}s infinite ease-in"/>`).join('')}</g>`;
   s+=`<g id="pl${p.k}"></g>`+ART.pot(x+280,330,210,130)+`<ellipse cx="${x+280}" cy="336" rx="96" ry="12" fill="${p.wat?'#5E3F22':'#B89068'}"/>`;
   if(!p.wat)s+=`<path d="M${x+215} 336l18 4 10-6 16 7M${x+300} 333l14 6 18-5" stroke="#8A6A45" stroke-width="3" fill="none"/>`;
   s+=`<text id="pt${p.k}" x="${x+280}" y="448" text-anchor="middle" font-size="25" font-weight="700" class="${p.sun?'lbl':'lbl-w'}"></text></g>`;});
  $('#potsvg',el).innerHTML=`<style>@keyframes dropf{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(8px,120px);opacity:0}}</style>`+s;
  $('#pcols',el).innerHTML=P.map(p=>`<div class="card" id="pc${p.k}" style="padding:20px 26px;transition:box-shadow .3s">
   <div class="row" style="gap:18px;font-size:25px;font-weight:700;margin-bottom:12px"><span>${ic('sun',34)} ${p.sun?'<span class="yes">Direct sunlight</span>':'<span class="no">In the dark</span>'}</span><span>${ic('drop',30)} ${p.wat?'<span class="yes">Water daily</span>':'<span class="no">No water</span>'}</span></div>
   <div class="row" style="gap:10px"><span style="font-size:22px;font-weight:700;color:var(--ink2)">Predict:</span>${['Grows well','Grows less','May die'].map(t=>`<button class="btn sm" style="font-size:20px;padding:10px 16px;white-space:nowrap" data-p="${p.k}">${t}</button>`).join('')}</div>
   <div class="pres" style="font-size:25px;font-weight:650;margin-top:12px;min-height:34px;color:var(--ink2)"></div></div>`).join('');
  o.state={};const R={A:'Grew well — taller, more new leaves, green',B:'Wilted — it may die without water',C:'Less growth than A — leaves turn pale/yellow'};o.R=R;
  o.draw=t=>{P.forEach(p=>{const e=p.end,st={g:lerp(.28,e.g,t),droop:(e.droop||0)*t,thin:(e.thin||0)*t,H:300,nobranch:1};if(e.col)st.col=mix('#3DB26A',e.col,t);$('#pl'+p.k,el).innerHTML=ART.plant(p.k==='A'?280:p.k==='B'?870:1460,334,st);});$('#pday',el).textContent='Day '+(1+Math.round(t*13));};
  o.reset=()=>{o.t=0;o.done=false;o.draw(0);P.forEach(p=>{$('#pt'+p.k,el).textContent='';$('#pc'+p.k+' .pres',el).textContent='';});$$('[data-p]',el).forEach(b=>b.classList.remove('sel'));o.state={};};
  $$('[data-p]',el).forEach(b=>b.onclick=()=>{const k=b.dataset.p;$$(`[data-p="${k}"]`,el).forEach(x=>x.classList.toggle('sel',x===b));o.state[k]=b.textContent;$('#pt'+k,el).textContent='Prediction: '+b.textContent;});
  P.forEach(p=>$('#pp'+p.k,el).onclick=()=>{P.forEach(q=>{$('#pp'+q.k,el).style.transform=q===p?'scale(1.03)':'';$('#pc'+q.k,el).style.boxShadow=q===p?'0 0 0 4px #3988E8, var(--shadow)':'';});});
  o.ff=()=>{if(o.done)return;o._bag.tw(4200,e=>{o.t=e;o.draw(e);},()=>{o.done=true;P.forEach(p=>{$('#pc'+p.k+' .pres',el).innerHTML='<b style="color:var(--ink)">After 2 weeks:</b> '+R[p.k];$('#pt'+p.k,el).textContent=R[p.k].split(' — ')[0];});});};

  o.reset();
 },
 enter(el,o){if(!o.done)o.reset();},
 onNext(el,o){if(!o.done){o.ff();return true;}return false;}

   <g id="lchl" opacity="0" style="transition:opacity .6s"><path d="M690 610L620 640" stroke="#239B56" stroke-width="4"/><rect x="290" y="616" width="340" height="52" rx="26" fill="#239B56"/><text x="460" y="651" text-anchor="middle" class="lbl-w" font-size="24">green pigment: chlorophyll</text></g>
  </svg><div class="ctrls overlay" style="right:30px;top:26px"><button class="btn" id="lsun" style="background:#FFF4D6">☀ Shine sunlight</button></div></div>
  <div class="col">
   <div class="card rv" data-s="1"><p>Plants store food in the form of <b>starch</b>, a type of <b>carbohydrate</b>. This starch is produced in the <b class="g">leaves</b>.</p></div>
   <div class="card rv" data-s="2"><p>Leaves are generally <b>broad and flat</b> — a large surface to receive sunlight.</p></div>
   <div class="card green rv" data-s="3"><p>Leaves are mostly green because of a green pigment called <b class="g">chlorophyll</b>.</p></div>
   <div class="card sun rv" data-s="4"><p>Chlorophyll helps in <b>capturing sunlight efficiently</b>.</p></div>
   <div class="concl rv" data-s="5" style="font-size:29px">Leaves are where the plant makes its food — the plant’s <b>food factories</b>!</div>
  </div></div>`,
 init(el,o){
  const R=rng(5);let c='';for(let yy=-170;yy<170;yy+=58)for(let xx=-190;xx<190;xx+=74){const ox=(Math.floor(yy/58)%2)*37;c+=`<rect x="${xx+ox}" y="${yy}" width="68" height="52" rx="20" fill="url(#gCell)" stroke="#9AD8AE" stroke-width="3"/>`;for(let k=0;k<6;k++)c+=`<ellipse cx="${xx+ox+12+R()*44}" cy="${yy+10+R()*32}" rx="7" ry="4.5" fill="#2FB463" transform="rotate(${R()*180} ${xx+ox+34} ${yy+26})"/>`;}
  $('#lcells',el).innerHTML=c;
  o.sun=v=>{o.on=v;$('#lrays',el).setAttribute('opacity',v?1:0);$('#bigleaf',el).classList.toggle('glowleaf',v);$('#lsun',el).textContent=v?'☾ Remove sunlight':'☀ Shine sunlight';};
  $('#lsun',el).onclick=()=>o.sun(!o.on);
 },
 enter(el,o){o.sun(false);},
 onStep(el,s,o){$('#lchl',el).setAttribute('opacity',s>=3?1:0);if(s>=4)o.sun(true);}
});

/* ===================== ACTIVITY 10.2 — STARCH TEST ===================== */
const GREEN='#2FA862',PALE='#EFE6C4',BB='#232A52',IOD='#C98A3C';
function stepList(items){return`<div class="steps">${items.map((t,i)=>`<div class="step"><div class="n">${i+1}</div><div>${t}</div></div>`).join('')}</div>`;}
function markSteps(el,s){$$('.step',el).forEach((d,i)=>{d.classList.toggle('on',i===s-1);d.classList.toggle('done',i<s-1);});}

S({id:'starch',sec:'10.2 Starch test',title:'Activity 10.2 — Starch test',head:'Activity 10.2: Testing a leaf for starch',zoom:true,
 notes:'Demonstration by the teacher only. Press <b>Next</b> to move through each step; the animation plays for that step. Emphasise: the test tube of alcohol is heated <b>in a water bath</b>, never directly on the flame.',
 html:`<div class="grid2"><div class="viz" style="background:linear-gradient(170deg,#F4F9FF,#FFFFFF)"><svg viewBox="0 0 1040 790" id="stsvg">
  <rect x="0" y="760" width="1040" height="30" fill="#E3ECF5"/>
  <g id="st-heat">
   <path d="M175 604H505" stroke="#5A6B7E" stroke-width="10" stroke-linecap="round"/><path d="M185 612V600M495 612V600" stroke="#5A6B7E" stroke-width="6"/>
   <path d="M200 606L160 760M480 606L520 760M340 606V760" stroke="#5A6B7E" stroke-width="9" stroke-linecap="round"/>
   <path d="M190 600q15-10 30 0t30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0" stroke="#8A9AAD" stroke-width="3" fill="none"/>
   <g transform="translate(340 690)"><path d="M-55 70Q-62 10 -20 0H20Q62 10 55 70Z" fill="url(#gGlass)" stroke="#8FB3D4" stroke-width="4"/><path d="M-50 70Q-55 30 -30 26H30Q55 30 50 70Z" fill="#CFE6FA"/><rect x="-8" y="-22" width="16" height="24" rx="4" fill="#C9C1A8"/>
    <g class="flick"><path d="M0 -84C-16 -60 -18 -40 0 -24C18 -40 16 -60 0 -84Z" fill="#FFB238"/><path d="M0 -66C-8 -52 -8 -40 0 -30C8 -40 8 -52 0 -66Z" fill="#FFF0B0"/></g></g>
   ${ART.beaker(200,300,280,296,.78)}
   <g id="st-bub">${Array.from({length:14},(_,i)=>`<circle cx="${225+(i*37)%230}" cy="580" r="${4+i%4*2}" fill="#fff" opacity=".8" style="animation:stbub ${1.6+(i%5)*.3}s ${-(i*.37)}s linear infinite"/>`).join('')}</g>
   <text x="200" y="285" class="lbl" font-size="24">Boiling water</text>
   <text x="560" y="610" class="lbl" font-size="22" fill="#4A5F78">Wire gauze</text><text x="420" y="740" class="lbl" font-size="22">Spirit lamp</text>
  </g>
  <g id="st-l1" opacity="0"><g transform="translate(245 500) rotate(-22)"><path id="stleaf1" d="${ART.leafPath(170,52)}" fill="${GREEN}"/></g>
   <g transform="translate(560 330)"><rect width="190" height="70" rx="35" fill="#142B45"/><text id="sttimer" x="95" y="46" text-anchor="middle" class="lbl-w" font-size="32">0 min</text></g></g>
  <g id="st-l2" opacity="0">
   <path d="M306 210V540a30 30 0 0060 0V210" fill="url(#gGlass)" stroke="#8FB3D4" stroke-width="5"/>
   <path id="stalc" d="M311 330V540a25 25 0 0050 0V330Z" fill="#EAF6FF" opacity=".95"/>
   <g transform="translate(336 350) rotate(90)"><path id="stleaf2" d="${ART.leafPath(190,22)}" fill="${GREEN}"/></g>
   <path d="M380 340H560" stroke="#142B45" stroke-width="3"/><text x="570" y="348" class="lbl" font-size="24">Alcohol in a test tube</text>
   <path d="M372 470H560" stroke="#142B45" stroke-width="3"/><text x="570" y="478" class="lbl" font-size="24">Leaf losing its colour</text>
   <text x="570" y="520" font-size="21" fill="#4A5F78" font-family="Inter,sans-serif" font-weight="600">(test tube kept in a hot water bath)</text></g>
  <g id="st-plate" opacity="0" transform="translate(520 440) scale(1.45) translate(-760 -600)">
   <ellipse cx="760" cy="640" rx="230" ry="66" fill="#DCE6F0"/><ellipse cx="760" cy="630" rx="230" ry="62" fill="#fff" stroke="#C9D7E5" stroke-width="4"/><ellipse cx="760" cy="630" rx="180" ry="44" fill="#F5F9FD"/>
   <g transform="translate(615 640) rotate(-8)"><path id="stleaf3" d="${ART.leafPath(300,80)}" fill="${PALE}" stroke="#D8CDA8" stroke-width="3"/><g id="stspots"></g></g>
   <text x="760" y="740" text-anchor="middle" class="lbl" font-size="24" id="stplbl">Decolourised leaf on a plate</text></g>
  <g id="st-drop" opacity="0" transform="translate(520 440) scale(1.45) translate(-760 -600)">
   <g transform="translate(930 470)"><rect x="-40" y="-90" width="80" height="120" rx="14" fill="#8A4B12"/><rect x="-22" y="-112" width="44" height="26" rx="6" fill="#3D2A1A"/><rect x="-32" y="-50" width="64" height="44" rx="6" fill="#fff"/><text y="-30" text-anchor="middle" font-size="13" font-weight="800" fill="#142B45" font-family="Inter,sans-serif">Iodine</text><text y="-14" text-anchor="middle" font-size="13" font-weight="800" fill="#142B45" font-family="Inter,sans-serif">solution</text></g>
   <g id="stdropper" transform="translate(760 300)"><rect x="-8" y="0" width="16" height="170" rx="6" fill="url(#gGlass)" stroke="#8FB3D4" stroke-width="3"/><rect x="-5" y="110" width="10" height="56" fill="${IOD}"/><ellipse cx="0" cy="-12" rx="22" ry="30" fill="#E0475B"/></g>
   <g id="stdrops"></g></g>
  <g id="st-res" opacity="0"><rect x="300" y="40" width="440" height="110" rx="26" fill="${BB}"/><text x="520" y="88" text-anchor="middle" class="lbl-w" font-size="30">Blue-black colour</text><text x="520" y="126" text-anchor="middle" font-size="24" fill="#FFE7A3" font-weight="700" font-family="Inter,sans-serif">→ starch is present</text></g>
 </svg><style>@keyframes stbub{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-210px);opacity:0}}</style></div>
 <div class="col" style="gap:16px">${stepList(['Keep a leaf in <b>boiling water</b> for five minutes to soften it.','Dip it in <b>alcohol</b> in a test tube; place the tube in a beaker of boiling water until the leaf becomes <b>colourless</b>.','Take out the leaf and place it on a <b>plate</b>.','Put a few drops of <b>diluted iodine solution</b> with a dropper.','Wait a few minutes. <b>Blue-black</b> colour shows the presence of <b>starch</b>.'])}
  ${CAUTION('Alcohol should <b>never</b> be placed near a heat source directly. It is highly flammable and can easily lead to fire and burns.')}</div></div>`,
 steps:5,
 onStep(el,s,o){
  o._bag.clear();markSteps(el,s);
  const show=(id,v)=>$(id,el).setAttribute('opacity',v?1:0);
  show('#st-heat',s<=2);show('#st-l1',s===1);show('#st-l2',s===2);show('#st-plate',s>=3);show('#st-drop',s===4);show('#st-res',s===5);
  $('#st-bub',el).style.display=s<=2?'':'none';
  $('.caution',el).style.boxShadow=s===2?'0 0 0 5px #FF9C80':'';
  const L1=$('#stleaf1',el),L2=$('#stleaf2',el),L3=$('#stleaf3',el),A=$('#stalc',el),sp=$('#stspots',el);
  L1.setAttribute('fill',GREEN);L2.setAttribute('fill',GREEN);A.setAttribute('fill','#EAF6FF');L3.setAttribute('fill',PALE);sp.innerHTML='';$('#stdrops',el).innerHTML='';
  $('#stplbl',el).textContent=s===5?'Leaf after iodine test':s===4?'Adding diluted iodine solution':'Decolourised leaf on a plate';
  if(s===1)o._bag.tw(2600,e=>$('#sttimer',el).textContent=Math.round(e*5)+' min');
  if(s===2){o._bag.add(tweenAttr(L2,'fill',GREEN,PALE,3800));o._bag.add(tweenAttr(A,'fill','#EAF6FF','#A7DDA9',3800));}
  const spots=()=>{sp.innerHTML=[[70,0,26],[150,-8,30],[220,6,22],[120,18,18]].map(([x,y,r])=>`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.6}" fill="${IOD}" opacity=".85"/>`).join('');};
  if(s===4){const d=$('#stdropper',el);o._bag.tw(900,e=>d.setAttribute('transform',`translate(${lerp(930,760,e)} ${lerp(260,400,e)})`),()=>{
    let n=0;const drop=()=>{if(n++>=4){spots();return;}const c=svgEl('circle',{cx:760,cy:600,r:9,fill:IOD},$('#stdrops',el));o._bag.tw(500,e=>c.setAttribute('cy',lerp(600,632,e)),()=>{c.remove();spots();o._bag.later(200,drop);});};drop();});}
  if(s===5){spots();$$('ellipse',sp).forEach(e=>e.setAttribute('fill',BB));o._bag.add(tweenAttr(L3,'fill',PALE,BB,2600));}
 }
});

/* ===================== WHY DECOLOURISE + BEFORE/AFTER ===================== */
function leafCard(fill,label,sub,vein){return`<div class="card" style="text-align:center;padding:24px"><svg width="380" height="210" viewBox="0 0 380 210"><g transform="translate(30 105)"><path d="${ART.leafPath(320,90)}" fill="${fill}"/><path d="M4 0H300" stroke="${vein||'rgba(255,255,255,.55)'}" stroke-width="6" stroke-linecap="round"/></g></svg><h3>${label}</h3><p class="muted" style="font-size:24px">${sub}</p></div>`;}
S({id:'decol',sec:'10.2 Starch test',title:'Why decolourise the leaf?',head:'Why do we decolourise the leaf first?',
 notes:'Ask the question first and let students think. Then reveal the side-by-side: iodine on a green leaf is hard to see.',
 html:`<div style="display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:20px;align-items:center">
   ${leafCard(GREEN,'Fresh leaf','Green due to chlorophyll')}<div style="font-size:60px;color:#9AB0C7">→</div>
   ${leafCard(PALE,'Decolourised','After alcohol in water bath','#D8CDA8')}<div style="font-size:60px;color:#9AB0C7">→</div>
   ${leafCard(BB,'After iodine','Blue-black = starch present')}</div>
  <div class="q" style="margin-top:34px"><div class="qm">?</div>Did you wonder why we decolourise the leaf at the beginning of this activity?</div>
  <div class="grid2 even rv" data-s="1" style="height:auto;margin-top:26px;gap:30px">
   <div class="fact" style="background:linear-gradient(135deg,#E3EFFD,#fff);border-color:#BFD6EE"><div class="tag" style="color:#3988E8">Dive deeper</div><p>Decolourisation removes the green colour, so we can <b>easily observe the colour change</b> — and thus the presence of starch.</p></div>
   <div class="card green"><p><b>So far:</b> Activity 10.1 — water and sunlight are essential for growth. Activity 10.2 — <b>green leaves store starch</b> as food.</p></div></div>`
});

/* ===================== ACTIVITY 10.3 — VARIEGATED LEAF ===================== */

  <path class="vm" d="${ART.leafPath(520,150)}" fill="#F3F0D2"/>
  <g clip-path="url(#${id}c)"><path class="vp" d="M40 0C70 -60 120 -95 190 -88C240 -110 300 -70 340 -84C400 -60 430 -30 470 -10C440 20 410 50 360 60C310 96 250 70 210 92C150 100 100 70 40 0Z" fill="${GREEN}"/></g>
  <path d="M6 0H500" stroke="rgba(255,255,255,.5)" stroke-width="6" stroke-linecap="round"/>
  <path class="vt" d="${ART.leafPath(520,150)}M40 0C70 -60 120 -95 190 -88C240 -110 300 -70 340 -84C400 -60 430 -30 470 -10C440 20 410 50 360 60C310 96 250 70 210 92C150 100 100 70 40 0Z" fill="none" stroke="#3988E8" stroke-width="4" stroke-dasharray="10 8" opacity="0"/></g>`;}
S({id:'a103',sec:'10.2 Why is chlorophyll important?',title:'Activity 10.3 — Variegated leaf',head:'Activity 10.3: How does sunlight help make starch?',zoom:true,
 notes:'Bhaskar uses a leaf with green and non-green patches (e.g. croton, coleus). Ask students to <b>predict</b> which parts will turn blue-black before you run the test. Press Next: trace → iodine test → observations.',
 html:`<div class="viz" style="height:470px"><svg viewBox="0 0 1740 470">
   <rect width="860" height="470" rx="28" fill="url(#gSky)"/>${ART.sun(780,80,36)}<rect x="880" width="860" height="470" rx="28" fill="#1C2B45"/>
   <circle cx="1650" cy="80" r="30" fill="#E6ECF5"/><circle cx="1664" cy="70" r="28" fill="#1C2B45"/>
   <text x="36" y="62" class="lbl" font-size="34">Plant kept in sunlight</text><text x="916" y="62" class="lbl-w" font-size="34">Plant kept in the dark — 36 hours</text>
   <g transform="translate(170 260)">${varLeaf('vl1')}</g><g transform="translate(1050 260)">${varLeaf('vl2')}</g>
   <g font-family="Inter,sans-serif" font-weight="700" font-size="26"><rect x="270" y="384" width="320" height="52" rx="26" fill="#fff"/><text id="vcap1" x="430" y="419" text-anchor="middle" fill="#142B45">Before the test</text>
   <rect x="1150" y="384" width="320" height="52" rx="26" fill="#fff"/><text id="vcap2" x="1310" y="419" text-anchor="middle" fill="#142B45">Before the test</text></g>
  </svg></div>
  <div style="display:grid;grid-template-columns:1fr 1.25fr;gap:30px;margin-top:22px">
   <div class="col" style="gap:14px"><div class="q" style="font-size:29px"><div class="qm">?</div>Predict: which parts of each leaf will turn blue-black?</div>
    <div class="ctrls"><button class="btn" id="vtr">✎ Trace patches</button><button class="btn pri" id="vgo">Do the iodine test</button><button class="btn sm" id="vrs">↺</button></div></div>
   <table class="tb rv" data-s="3"><tr><th>Light condition</th><th>Before test</th><th>After iodine test</th></tr>
    <tr><td>Plant in <b>sunlight</b></td><td>Green and non-green patches</td><td><b>Green patches turned blue-black</b></td></tr>
    <tr><td>Plant in the <b>dark</b></td><td>Green and non-green patches</td><td><b>No change in colour</b></td></tr></table></div>`,
 steps:3,
 init(el,o){
  const parts=id=>({m:$('#'+id+' .vm',el),p:$('#'+id+' .vp',el),t:$('#'+id+' .vt',el)});
  o.set=(stage)=>{o._bag.clear();const a=parts('vl1'),b=parts('vl2');
   [a,b].forEach(x=>{x.m.setAttribute('fill','#F3F0D2');x.p.setAttribute('fill',GREEN);x.t.setAttribute('opacity',stage>=1?1:0);});
   $('#vcap1',el).textContent=$('#vcap2',el).textContent=stage>=1?'Patches traced':'Before the test';
   if(stage>=2){const run=()=>{$('#vcap1',el).textContent=$('#vcap2',el).textContent='Decolourising…';
     o._bag.add(tweenAttr([a.p,b.p],'fill',GREEN,PALE,1400,()=>{$('#vcap1',el).textContent=$('#vcap2',el).textContent='Adding iodine…';
      o._bag.add(tweenAttr([a.m,b.m],'fill','#F3F0D2',IOD,1800));o._bag.add(tweenAttr(a.p,'fill',PALE,BB,1800));o._bag.add(tweenAttr(b.p,'fill',PALE,'#D6AA6B',1800,()=>{
       $('#vcap1',el).textContent='Green parts: blue-black';$('#vcap2',el).textContent='No blue-black anywhere';}));}));};run();}
  };
  $('#vtr',el).onclick=()=>{APP.step=Math.max(APP.step,1);applyStep();};
  $('#vgo',el).onclick=()=>{APP.step=Math.max(APP.step,2);applyStep();};
  $('#vrs',el).onclick=()=>{APP.step=0;applyStep();};
 },
 onStep(el,s,o){if(s!==o.last){if(!(o.last>=2&&s>=2))o.set(s);o.last=s;}},
 enter(el,o){o.last=-1;}
});

/* ===================== 10.3 INFERENCE + COLOURED LEAVES ===================== */
S({id:'chl',sec:'10.2 Why is chlorophyll important?',title:'Chlorophyll is essential',head:'What do we infer?',
 notes:'Discuss the tricky question: the non-green patches may still have a little chlorophyll — just not enough to make detectable starch. Then the coloured-leaves fact: click a leaf.',
 html:`<div class="grid2 even" style="height:auto">
  <div class="col">
   <div class="card rv" data-s="1"><p>Starch is produced <b>only where the green patches are</b> — and only when the plant gets <b>sunlight</b>.</p></div>
   <div class="q rv" data-s="2" style="font-size:28px"><div class="qm">?</div>Non-green patches did not turn blue-black. Does it mean there is no chlorophyll there?</div>
   <div class="card blue rv" data-s="3"><p>Not necessarily! They <b>may not have sufficient chlorophyll</b> to prepare enough starch to be detected by the iodine test.</p></div>
   <div class="concl rv" data-s="4"><b>Chlorophyll is essential</b> for preparing starch in the presence of sunlight. Hence leaves are called the <b>‘food factories’</b> of plants.</div>
  </div>
  <div class="fact rv" data-s="5"><div class="tag">Fascinating fact</div><h3 style="margin-bottom:10px">Red, violet and brown leaves</h3>
   <svg viewBox="0 0 760 260" style="width:100%;height:250px">${[['#B3263E',0],['#6E3B8E',250],['#8A5A2B',500]].map(([c,x],i)=>`<g class="clk" data-cl="${i}" transform="translate(${x+20} 130) rotate(-20)"><path d="${ART.leafPath(220,70)}" fill="${c}"/><path class="hid" d="${ART.leafPath(220,70)}" fill="${GREEN}" opacity="0" style="transition:opacity .6s"/><path d="M4 0H206" stroke="rgba(255,255,255,.5)" stroke-width="5"/></g>`).join('')}</svg>
   <p style="font-size:27px">They contain <b>more of these coloured pigments</b> than green chlorophyll, which <b>hides the green colour</b>. Some of these pigments also help in photosynthesis. An iodine test shows starch in these leaves too! <span class="muted">(Tap a leaf.)</span></p></div></div>`,
 init(el){$$('[data-cl]',el).forEach(g=>g.onclick=()=>{const h=$('.hid',g);h.setAttribute('opacity',h.getAttribute('opacity')==='0'?.55:0);});}
});

S({id:'a104',sec:'10.2 Role of carbon dioxide',title:'Activity 10.4 — Caustic soda bottle',head:'Activity 10.4: Is carbon dioxide needed?',
 notes:'Demonstration by the teacher only. Caustic soda (sodium hydroxide) absorbs carbon dioxide, so the air inside the bottle has no CO₂. Everything else (water, sunlight, chlorophyll) is the same for both halves of the leaf.',

 <div class="grid2 even" style="height:auto;margin-top:30px;gap:30px">

 ${[0,1,2].map(j=>[0,1,2,3,4].map(k=>`<g transform="translate(${x+214+j*39-k*1.5} ${720-k*24})">${[-50,-20,20,50].map(a=>`<ellipse rx="11" ry="3.5" cx="9" fill="#3DB26A" transform="rotate(${a+(k%2)*15}) "/>`).join('')}</g>`).join('')).join('')}
 <path d="M${x+130} 735L${x+238} 520V440H${x+272}V520L${x+380} 735" fill="url(#gGlass)" stroke="#8FB3D4" stroke-width="5" stroke-linejoin="round"/>

 <rect id="gas${dark?'B':'A'}" x="${x+231}" y="205" width="48" height="0" fill="#FFFFFF" opacity=".9"/>
 <g id="bub${dark?'B':'A'}"></g>
 <text x="${x+300}" y="250" font-size="22" font-weight="700" class="${dark?'lbl-w':'lbl'}">Inverted test tube</text>
 <text x="${x+300}" y="560" font-size="22" font-weight="700" class="lbl">Funnel</text><text x="${x+86}" y="775" font-size="22" font-weight="700" class="${dark?'lbl-w':'lbl'}">Water plant in water</text>`;}
S({id:'a105',sec:'10.2 Oxygen is released',title:'Activity 10.5 — Bubbles of oxygen',head:'Activity 10.5: Do plants release something?',zoom:true,
 notes:'Compare set-ups A and B. Ask: <i>Where do you see bubbles? Which gas could it be?</i> Then reveal Barkha didi’s matchstick test (teacher demonstration only).',
 html:`<div class="grid2" style="grid-template-columns:1.32fr 1fr"><div class="viz"><svg viewBox="0 0 1040 790">${o2setup(0,0)}${o2setup(530,1)}</svg></div>
 <div class="col" style="gap:12px">
  <div class="q" style="font-size:27px;padding:16px 24px"><div class="qm">?</div><div>What difference do you observe between set-ups A and B?</div></div>
  <div class="card rv" data-s="1" style="padding:16px 24px"><p style="font-size:27px">In <b>A (sunlight)</b>, bubbles of gas rise from the plant and collect at the top of the test tube. In <b>B (dark)</b> there are no bubbles.</p></div>
  <div class="card rv" data-s="2" style="padding:18px 24px;display:flex;gap:20px;align-items:center"><svg width="170" height="210" viewBox="0 0 170 210" id="mtsvg">
    <path d="M60 60V170a25 25 0 0050 0V60" fill="rgba(220,240,255,.6)" stroke="#8FB3D4" stroke-width="5"/>
    <g id="mtstick" transform="translate(85 0)"><rect x="-3" y="20" width="6" height="110" fill="#E8C48A"/><circle cy="20" r="6" fill="#B3263E"/><g id="mtflame" class="flick" style="transform-origin:0 18px"><path d="M0 -26C-12 -8 -12 6 0 16C12 6 12 -8 0 -26Z" fill="#FFB238"/><path d="M0 -12C-5 -2 -5 6 0 12C5 6 5 -2 0 -12Z" fill="#FFF3B0"/></g></g></svg>
   <div><p style="font-size:25px">Barkha didi closed the tube with her thumb, took it out, and quickly inserted a <b>lit matchstick</b>. It burned with an <b>intense flame</b>!</p><button class="btn sm pri" id="mtgo" style="margin-top:12px">🔥 Insert lit matchstick</button></div></div>
  <div class="rv" data-s="2">${CAUTION('Only the teacher should handle a lit matchstick.')}</div>
  <div class="concl rv" data-s="3" style="font-size:26px;padding:20px 28px">The gas is rich in <b>oxygen</b>. Oxygen is released during photosynthesis, which occurs in the presence of <b>sunlight</b>.</div>
 </div></div>`,
 init(el,o){
  o.bs=[];o.gas=0;const box=$('#bubA',el);
  o.spawn=()=>{const c=svgEl('circle',{r:3+Math.random()*4,fill:'rgba(255,255,255,.75)',stroke:'#fff','stroke-width':1.5},box);o.bs.push({c,x:205+Math.random()*110,y:640+Math.random()*60,v:70+Math.random()*50});};
  o.reset=()=>{o.bs.forEach(b=>b.c.remove());o.bs=[];o.gas=0;$('#gasA',el).setAttribute('height',0);o.acc=0;const f=$('#mtflame',el);f.setAttribute('transform','');f.style.filter='';$('#mtstick',el).setAttribute('transform','translate(85 0)');};
  $('#mtgo',el).onclick=()=>{const st=$('#mtstick',el),f=$('#mtflame',el);o._bag.tw(800,e=>st.setAttribute('transform',`translate(85 ${e*70})`),()=>o._bag.tw(700,e=>{f.setAttribute('transform',`scale(${1+e*1.4})`);f.style.filter=`drop-shadow(0 0 ${e*14}px #FFD166)`;}));};
 },
 enter(el,o){o.reset();},
 tick(dt,t,el,o){o.acc=(o.acc||0)+dt;if(o.acc>.12&&o.bs.length<40){o.acc=0;o.spawn();}
  const top=205+o.gas;
  o.bs=o.bs.filter(b=>{b.y-=b.v*dt;const tx=255;if(b.y<540)b.x=lerp(b.x,tx,clamp(dt*4,0,1));b.c.setAttribute('cx',b.x+Math.sin(b.y/9)*1.5);b.c.setAttribute('cy',b.y);
   if(b.y<top+4){b.c.remove();o.gas=Math.min(120,o.gas+.35);return false;}return true;});
  $('#gasA',el).setAttribute('height',o.gas);}
});

S({id:'a106',sec:'10.2 Stomata: tiny gateways',title:'Activity 10.6 — Leaf peel',head:'Activity 10.6: Where do gases enter and leave?',zoom:true,
 notes:'Teacher demonstration. Rhoeo leaves give the best peel. Use <b>Low power / High power</b> to zoom the microscope view. Students should spot the tiny pores — stomata.',
 html:`<div class="grid2" style="grid-template-columns:1fr 1.05fr">
  <div class="col" style="gap:10px">${stepList(['Collect a leaf (rhoeo, money plant, onion, hibiscus, coleus or grass) and put it in a beaker of water.','Carefully <b>peel a thin layer</b> from the <b>lower surface</b> of the leaf; keep it in a watch glass with water.','Put a drop of water on a slide and transfer the peel with <b>forceps</b>.','Add a drop of <b>ink</b> with a dropper, cover with a <b>coverslip</b>.','Observe it under a <b>microscope</b>.'])}
   <div class="concl rv" data-s="6" style="font-size:28px">These tiny pores are called <b>stomata</b>. Stomata on the surface of leaves help in the <b>exchange of gases</b>.</div></div>
  <div class="viz" style="background:#0F1C2E;display:grid;place-items:center"><svg viewBox="0 0 800 790" style="width:100%;height:100%">
   <defs><clipPath id="mcl"><circle cx="400" cy="370" r="330"/></clipPath></defs>
   <circle cx="400" cy="370" r="345" fill="#2A3B56"/>
   <g clip-path="url(#mcl)"><rect x="0" y="0" width="800" height="790" fill="#E6E9FA"/><g id="peel" style="transition:transform 1.4s cubic-bezier(.4,0,.2,1);transform-origin:400px 370px"></g><circle cx="400" cy="370" r="330" fill="url(#gVig)"/></g>
   <g id="mlbl" opacity="0" style="transition:opacity .6s"><path d="M470 300L600 170" stroke="#142B45" stroke-width="4"/><rect x="520" y="110" width="250" height="60" rx="30" fill="#142B45"/><text x="645" y="149" text-anchor="middle" class="lbl-w" font-size="25">Stoma (tiny pore)</text></g>
   <g transform="translate(110 690)"><rect width="160" height="8" fill="#fff"/><text x="80" y="38" text-anchor="middle" class="lbl-w" font-size="22">0.1 mm</text></g>
   <text x="400" y="770" text-anchor="middle" class="lbl-w" font-size="24" id="mmag">Low power</text></svg>
   <div class="ctrls overlay" style="right:22px;top:22px"><div class="seg"><button id="mlo" class="on">Low power</button><button id="mhi">High power</button></div></div></div></div>`,
 steps:6,
 init(el,o){
  const R=rng(33),cw=74,chh=48,cols=24,rows=30,V=[];for(let j=0;j<=rows;j++){V[j]=[];for(let i=0;i<=cols;i++)V[j][i]=[(i-cols/2)*cw+400+(j%2)*cw/2+(R()-.5)*26,(j-rows/2)*chh+370+(R()-.5)*18];}
  let s='';const sto=[];
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const a=V[j][i],b=V[j][i+1],c=V[j+1][i+1],d=V[j+1][i];s+=`<path d="M${a}L${b}L${c}L${d}Z" fill="#DCE1F6" stroke="#6E62B8" stroke-width="3" stroke-linejoin="round"/>`;
   if(R()<.075)sto.push([(a[0]+c[0])/2,(a[1]+c[1])/2,R()*60-30]);}
  sto.push([432,328,-20]);
  sto.forEach(([x,y,r])=>{s+=`<g transform="translate(${x} ${y}) rotate(${r})"><ellipse cx="-11" rx="11" ry="20" fill="#9ED39A" stroke="#3F7A45" stroke-width="2.5"/><ellipse cx="11" rx="11" ry="20" fill="#9ED39A" stroke="#3F7A45" stroke-width="2.5"/><ellipse rx="3.6" ry="13" fill="#2B2350"/>${[[-12,-8],[-13,6],[12,-6],[11,8]].map(([p,q])=>`<circle cx="${p}" cy="${q}" r="3" fill="#3F9A4A"/>`).join('')}</g>`;});
  $('#peel',el).innerHTML=s;
  o.mag=hi=>{$('#peel',el).style.transform=hi?'scale(1.9)':'scale(.55)';$('#mlo',el).classList.toggle('on',!hi);$('#mhi',el).classList.toggle('on',hi);$('#mmag',el).textContent=hi?'High power':'Low power';$('#mlbl',el).setAttribute('opacity',hi?1:0);};
  $('#mlo',el).onclick=()=>o.mag(false);$('#mhi',el).onclick=()=>o.mag(true);
 },
 onStep(el,s,o){markSteps(el,Math.min(s,5));if(s>=6)$$('.step',el).forEach(d=>{d.classList.remove('on');d.classList.add('done');});o.mag(s>=5);}
});

/* ===================== STOMATA — GAS EXCHANGE ===================== */
S({id:'gasx',sec:'10.2 Stomata: tiny gateways',title:'Gas exchange through stomata',head:'Stomata: the tiny gateways',
 notes:'Toggle between the two processes. In sunlight, carbon dioxide goes in and oxygen comes out (photosynthesis). For respiration, oxygen goes in and carbon dioxide comes out — this happens all the time, day and night.',
 html:`<div class="grid2"><div class="viz" style="background:linear-gradient(180deg,#F4FBFF,#fff)"><svg viewBox="0 0 1040 790" id="gxsvg">
  <g id="gxsun">${ART.sun(90,80,40)}</g>
  
  <rect x="40" y="130" width="960" height="420" rx="40" fill="#E9F8EE"/>
  <g id="gxcells"></g>
  <text x="60" y="610" class="lbl" font-size="24">Lower surface of the leaf</text><text x="60" y="122" class="lbl" font-size="24">Upper surface</text>
  <g id="gxf"></g>
  <path id="gin" d="M440 780Q470 640 505 520Q515 470 470 400" fill="none"/><path id="gout" d="M570 400Q530 470 535 520Q560 640 610 780" fill="none"/>
  <g font-family="Inter,sans-serif" font-weight="800" font-size="26"><rect x="150" y="690" width="210" height="50" rx="25" fill="#fff" stroke="#C9D7E5" stroke-width="2"/><text x="255" y="724" text-anchor="middle" fill="#142B45" id="gxin">CO₂ goes in</text>
  <rect x="680" y="690" width="230" height="50" rx="25" fill="#fff" stroke="#C9D7E5" stroke-width="2"/><text x="795" y="724" text-anchor="middle" fill="#142B45" id="gxout">O₂ comes out</text></g>
  <path d="M520 600L600 650" stroke="#142B45" stroke-width="3"/><text x="606" y="664" class="lbl" font-size="22">Stoma (pore)</text>
 </svg><div class="ctrls overlay" style="right:24px;top:96px"><div class="seg"><button id="gxp" class="on">Photosynthesis</button><button id="gxr">Respiration</button></div></div></div>
 <div class="col">
  <div class="card"><p class="muted" style="font-size:23px;margin-bottom:6px">Picture: section through a leaf (magnified)</p><p>Stomata are tiny pores, mostly on the <b>lower surface</b> of leaves. They help in the <b>exchange of gases</b>.</p></div>
  <div class="card sun rv" data-s="1"><h3>During photosynthesis</h3><p><b>Carbon dioxide enters</b> the leaf; <b>oxygen is released</b>.</p></div>
  <div class="card blue rv" data-s="2"><h3>During respiration</h3><p><b>Oxygen enters</b>; <b>carbon dioxide is released</b>.</p></div>
  <div class="concl rv" data-s="3" style="font-size:28px">The same tiny pores serve <b>both</b> processes.</div></div></div>`,
 init(el,o){
  const R=rng(8);let s='';for(let x=60;x<990;x+=52)s+=`<rect x="${x}" y="140" width="48" height="34" rx="10" fill="#F4FFF6" stroke="#9AD8AE" stroke-width="2"/>`;
  for(let x=64;x<980;x+=40)s+=`<rect x="${x}" y="182" width="34" height="140" rx="16" fill="url(#gCell)" stroke="#8ED3A6" stroke-width="2"/>`+[0,1,2,3,4].map(k=>`<ellipse cx="${x+10+(k%2)*14}" cy="${200+k*25}" rx="6" ry="4" fill="#2FB463"/>`).join('');
  for(let i=0;i<34;i++){const x=80+R()*880,y=350+R()*130;if(Math.abs(x-520)<70&&y>420)continue;s+=`<circle cx="${x}" cy="${y}" r="${22+R()*12}" fill="url(#gCell)" stroke="#8ED3A6" stroke-width="2"/><circle cx="${x+6}" cy="${y-4}" r="4" fill="#2FB463"/><circle cx="${x-8}" cy="${y+6}" r="4" fill="#2FB463"/>`;}
  for(let x=60;x<990;x+=52){if(x>440&&x<580)continue;s+=`<rect x="${x}" y="505" width="48" height="34" rx="10" fill="#F4FFF6" stroke="#9AD8AE" stroke-width="2"/>`;}
  s+=`<ellipse cx="488" cy="522" rx="26" ry="20" fill="#7FCB8A" stroke="#3F7A45" stroke-width="3"/><ellipse cx="552" cy="522" rx="26" ry="20" fill="#7FCB8A" stroke="#3F7A45" stroke-width="3"/>`;
  $('#gxcells',el).innerHTML=s;
  const F=$('#gxf',el);o.f={ci:new Flow($('#gin',el),{kind:'co2',r:16,n:4,speed:.16,into:F}),oo:new Flow($('#gout',el),{kind:'o2',r:16,n:4,speed:.16,seed:5,into:F}),oi:new Flow($('#gin',el),{kind:'o2',r:16,n:4,speed:.16,seed:6,into:F}),co:new Flow($('#gout',el),{kind:'co2',r:16,n:4,speed:.16,seed:7,into:F})};
  o.mode=m=>{o.m=m;const p=m==='p';o.f.ci.set(p);o.f.oo.set(p);o.f.oi.set(!p);o.f.co.set(!p);$('#gxp',el).classList.toggle('on',p);$('#gxr',el).classList.toggle('on',!p);
   $('#gxin',el).textContent=p?'CO₂ goes in':'O₂ goes in';$('#gxout',el).textContent=p?'O₂ comes out':'CO₂ comes out';$('#gxsun',el).style.opacity=p?1:.25;};
  $('#gxp',el).onclick=()=>o.mode('p');$('#gxr',el).onclick=()=>o.mode('r');
 },
 onStep(el,s,o){if(s===1)o.mode('p');if(s===2)o.mode('r');if(s===0)o.mode('p');},
 tick(dt,t,el,o){Object.values(o.f).forEach(f=>f.tick(dt));}
});

/* ===================== 10.3 TRANSPORT OF WATER & MINERALS ===================== */
const ROUTE=['Roots','Stem','Branches','Leaves'];
S({id:'xyl',sec:'10.3 Transport: xylem',title:'Water travels up',head:'How do water and minerals reach the leaves?',zoom:true,
 notes:'Take students underground. Press Next to follow the water: roots → stem → branches → leaves. Blue drops = water; purple diamonds = dissolved minerals.',
 html:`<div class="grid2"><div class="viz"><svg viewBox="0 0 1040 790">
  <rect width="1040" height="380" fill="url(#gSky)"/><rect y="380" width="1040" height="410" fill="url(#gSoil)"/><path d="M0 382Q260 370 520 382T1040 378V392H0Z" fill="#5DBB7C"/>
  <g id="xsoil"></g>
  <g stroke="#D8B27D" stroke-linecap="round" fill="none"><path d="M520 380V700" stroke-width="22"/><path d="M520 450Q440 480 360 560M520 480Q610 520 690 600M520 560Q470 620 420 700M520 600Q580 670 640 740" stroke-width="11"/>
   <g stroke-width="2.5" stroke="#EBD3AE">${[[380,545],[400,525],[430,505],[660,575],[630,553],[600,530],[435,680],[455,655],[620,715],[600,690]].map(([x,y])=>`<path d="M${x} ${y}l-14 10M${x} ${y}l10 14"/>`).join('')}</g></g>
  <path d="M520 382V110" stroke="url(#gStem)" stroke-width="40" stroke-linecap="round"/><path d="M520 380V112" stroke="#BFE0FF" stroke-width="12" stroke-linecap="round" opacity=".9"/>
  <path d="M520 220Q420 170 330 140M520 190Q620 140 720 110" stroke="#2E9C57" stroke-width="18" fill="none" stroke-linecap="round"/><path d="M520 220Q420 170 330 140M520 190Q620 140 720 110" stroke="#BFE0FF" stroke-width="5" fill="none" stroke-linecap="round"/>
  ${ART.leaf(330,140,150,50,-160)}${ART.leaf(720,110,150,50,-20)}${ART.leaf(520,112,130,44,-90)}${ART.leaf(520,300,120,40,-30)}${ART.leaf(520,280,120,40,-150)}
  <g id="xflows"></g>
  <g font-family="Inter,sans-serif" font-weight="800" font-size="26" id="xlbls">
   <g class="xl" opacity="0"><rect x="730" y="470" width="130" height="46" rx="23" fill="#fff"/><text x="795" y="502" text-anchor="middle" fill="#142B45">Roots</text></g>
   <g class="xl" opacity="0"><rect x="560" y="290" width="120" height="46" rx="23" fill="#fff"/><text x="620" y="322" text-anchor="middle" fill="#142B45">Stem</text></g>
   <g class="xl" opacity="0"><rect x="770" y="160" width="170" height="46" rx="23" fill="#fff"/><text x="855" y="192" text-anchor="middle" fill="#142B45">Branches</text></g>
   <g class="xl" opacity="0"><rect x="820" y="40" width="150" height="46" rx="23" fill="#fff"/><text x="895" y="72" text-anchor="middle" fill="#142B45">Leaves</text></g>
   <g id="xxl" opacity="0" style="transition:opacity .6s"><path d="M528 330L340 330" stroke="#142B45" stroke-width="3"/><rect x="60" y="306" width="290" height="50" rx="25" fill="#3988E8"/><text x="205" y="340" text-anchor="middle" fill="#fff">XYLEM (tubes)</text></g></g>
 </svg></div>
 <div class="col">
  <div class="card"><p>Water, along with <b>minerals</b> in the soil, is taken up by the <b>roots</b>. Minerals are important nutrients for plant growth.</p></div>
  <div class="row" id="xroute" style="gap:10px;flex-wrap:wrap">${ROUTE.map((r,i)=>`<div class="pill" style="font-size:28px;padding:12px 22px;background:#EEF3F8;color:#8AA2BD;transition:all .4s">${r}</div>${i<3?'<span style="font-size:32px;color:#9AB0C7">→</span>':''}`).join('')}</div>

 </div></div>`,

 init(el,o){
  const R=rng(41);let s='';for(let i=0;i<30;i++){const x=60+R()*920,y=420+R()*350;s+=`<g transform="translate(${x} ${y})">${ART.mol(i%3?'water':'mineral',i%3?9:7)}</g>`;}$('#xsoil',el).innerHTML=s;

   [['M520 380V220']],
   [['M520 220Q420 170 330 140','M520 190Q620 140 720 110','M520 220V112']],
   [['M330 140L200 100','M720 110L850 70','M520 112V-10']]];
  o.seg=seg.map((g,k)=>g[0].map((d,i)=>[new Flow(P(d),{kind:'water',r:8,n:k===2?6:3,speed:k===2?.35:.45,seed:k*10+i,into:F}),new Flow(P(d),{kind:'mineral',r:6,n:k===2?3:1,speed:k===2?.3:.4,seed:k*10+i+5,into:F})]).flat());

});

 {t:'Reasoning',q:'X is broken down using Y to release carbon dioxide, Z and energy. X, Y and Z are:',o:['X = oxygen, Y = glucose, Z = water','X = glucose, Y = oxygen, Z = water','X = water, Y = carbon dioxide, Z = glucose','X = starch, Y = water, Z = oxygen'],a:1,w:'Glucose + Oxygen → Carbon dioxide + Water + Energy. So X = glucose, Y = oxygen, Z = water.',v:'energy'},
 {t:'True or False',q:'Only the green parts of a plant carry out respiration.',o:['True','False'],a:1,w:'False. All parts of a plant, green or non-green, carry out respiration.',v:'energy'},
 {t:'Predict the result',q:'Vani keeps four plants: (a) sunlight with CO₂, (b) sunlight without CO₂, (c) dark with CO₂, (d) dark without CO₂. In which will starch be formed?',o:['(a) only','(a) and (b)','(a) and (c)','All four'],a:0,w:'Photosynthesis needs both sunlight and carbon dioxide (plus water and chlorophyll). Only plant (a) has both.',v:'sun'},
 {t:'Know a scientist',q:'Which Indian scientist worked on the sap of the coconut palm as a nutritive drink called Neera?',o:['Rustom Hormusji Dastur','Kamala Sohonie','C. V. Raman','Jagadish Chandra Bose'],a:1,w:'Kamala Sohonie (1911–1998) — Ph.D. from Cambridge on respiration in plants; worked on Neera and the nutritive value of plant foods.',v:'bulb'}];
const QFIG={sto:`<svg width="300" height="300" viewBox="0 0 300 300"><circle cx="150" cy="150" r="146" fill="#E6E9FA" stroke="#2A3B56" stroke-width="8"/>${[[60,80],[140,60],[220,90],[70,170],[150,150],[230,180],[100,240],[190,240]].map(([x,y])=>`<rect x="${x-38}" y="${y-24}" width="76" height="48" rx="8" fill="#DCE1F6" stroke="#6E62B8" stroke-width="3"/>`).join('')}<g transform="translate(150 150)"><ellipse cx="-13" rx="13" ry="24" fill="#9ED39A" stroke="#3F7A45" stroke-width="3"/><ellipse cx="13" rx="13" ry="24" fill="#9ED39A" stroke="#3F7A45" stroke-width="3"/><ellipse rx="4" ry="15" fill="#2B2350"/></g><path d="M260 40L180 120" stroke="#E0475B" stroke-width="7" marker-end="url(#mArrow)"/></svg>`,
 xyl:`<svg width="300" height="300" viewBox="0 0 300 300"><circle cx="150" cy="150" r="140" fill="#7CC98F"/><circle cx="150" cy="150" r="128" fill="#E8F6E1"/>${Array.from({length:8},(_,i)=>{const a=i/8*Math.PI*2;return`<g transform="translate(${150+Math.cos(a)*85} ${150+Math.sin(a)*85}) rotate(${a*180/Math.PI+90})"><ellipse cy="-12" rx="18" ry="12" fill="#F4E2B8"/><ellipse cy="8" rx="16" ry="15" fill="#D7334B"/></g>`}).join('')}<path d="M290 260L250 170" stroke="#142B45" stroke-width="6" marker-end="url(#mArrow)"/></svg>`};
S({id:'quiz',sec:'Knowledge check',title:'Interactive quiz',head:'Knowledge check',zoom:true,
 notes:'Let students answer (show of hands or teams) before clicking. The explanation appears after each attempt. <b>Next</b> moves to the next question once answered; use <b>Skip</b> to move on without answering.',
 html:`<div class="row" style="position:absolute;right:90px;top:64px;gap:16px"><div class="pill" id="qzn">Question 1 of ${QZ.length}</div><div class="pill g" id="qzs" style="font-size:28px">Score 0</div></div>
  <div id="qzbox"></div>`,
 init(el,o){o.reset=()=>{o.i=0;o.score=0;o.done=false;o.ans=QZ.map(()=>null);o.render();};
  o.render=()=>{const box=$('#qzbox',el);$('#qzs',el).textContent='Score '+o.score;
   if(o.i>=QZ.length){o.done=true;$('#qzn',el).textContent='Finished!';const pc=o.score/QZ.length;
    box.innerHTML=`<div class="card" style="text-align:center;padding:60px"><div class="bob" style="display:inline-block">${ic(pc>=.7?'ok':'bulb',140)}</div><h2 class="t" style="font-size:72px;margin-top:20px">${o.score} / ${QZ.length}</h2><p class="big">${pc>=.8?'Outstanding — you are a plant scientist!':pc>=.5?'Well done! Revise the topics you missed.':'Good try! Let’s revisit the chapter together.'}</p><div class="ctrls" style="justify-content:center;margin-top:30px"><button class="btn" id="qzagain">↺ Try again</button><button class="btn pri" id="qzfin">Final challenge ▶</button></div></div>`;
    $('#qzagain',el).onclick=o.reset;$('#qzfin',el).onclick=()=>go(APP.i+1,'fwd');return;}
   const q=QZ[o.i];$('#qzn',el).textContent=`Question ${o.i+1} of ${QZ.length}`;
   let body='';
   if(q.m){const right=q.m.map((p,i)=>i).sort((a,b)=>((a*7+3)%5)-((b*7+3)%5));
    body=`<div class="mt" style="margin-top:10px">${q.m.map((p,i)=>`<button data-l="${i}">${p[0]}</button><button data-r="${right[i]}">${q.m[right[i]][1]}</button>`).join('')}</div>`;}
   else body=`<div style="display:flex;gap:34px;align-items:center">${q.fig?`<div style="flex:none">${QFIG[q.fig]}</div>`:''}<div class="qz-opts" style="flex:1;${q.o.length===2?'grid-template-columns:1fr 1fr':''}">${q.o.map((t,i)=>`<button class="qz-opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span>${t}</button>`).join('')}</div></div>`;
   box.innerHTML=`<div class="card" style="padding:34px 40px"><div class="pill y" style="margin-bottom:14px">${q.t}</div><p style="font-size:38px;font-weight:750;line-height:1.3;margin-bottom:26px">${q.q}</p>${body}</div>
    <div id="qzfb" style="margin-top:22px;min-height:120px"></div><div class="ctrls" style="position:absolute;right:90px;bottom:30px"><button class="btn sm" id="qzskip">Skip</button><button class="btn pri" id="qznext" style="display:none">Next question ▶</button></div>`;
   $('#qzskip',el).onclick=()=>{o.i++;o.render();};$('#qznext',el).onclick=()=>{o.i++;o.render();};
   const fb=(ok)=>{o.ans[o.i]=ok;if(ok)o.score++;$('#qzs',el).textContent='Score '+o.score;$('#qzfb',el).innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ic(ok?'ok':'bad',64)}<div style="flex:1"><b>${ok?'Correct!':'Not quite.'}</b> ${q.w}</div>${ic(q.v,90)}</div>`;$('#qzskip',el).style.display='none';$('#qznext',el).style.display='';};
   if(q.m){let pick=null,mist=0,got=0;$$('.mt button',el).forEach(b=>b.onclick=()=>{
     if(b.dataset.l!==undefined){$$('[data-l]',el).forEach(x=>x.classList.remove('pick'));b.classList.add('pick');pick=b;return;}
     if(!pick)return;if(pick.dataset.l===b.dataset.r){pick.classList.remove('pick');pick.classList.add('ok');b.classList.add('ok');pick=null;if(++got===q.m.length)fb(mist===0);}
     else{mist++;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');}});}
   else $$('.qz-opt',el).forEach(b=>b.onclick=()=>{if(o.ans[o.i]!==null)return;const k=+b.dataset.i,ok=k===q.a;$('.qz-opts',el).parentElement.classList.add('qz-locked');
     $$('.qz-opt',el).forEach((x,j)=>{if(j===q.a)x.classList.add('right');else if(j===k)x.classList.add('wrong');else x.classList.add('dim');});fb(ok);});
  };
  o.reset();},
 onNext(el,o){if(o.done)return false;if(o.ans[o.i]!==null){o.i++;o.render();}return true;}
});

/* ===================== FINAL CHALLENGE ===================== */
S({id:'final',sec:'Final challenge',title:'What if…?',head:'Final challenge',zoom:true,
 notes:'Give students a full minute to think (use the timer). Take answers from several students, then reveal the guided explanation step by step. This links to textbook questions 2 and 10.',
 html:`<div class="q" style="font-size:42px;padding:34px 40px"><div class="qm" style="width:76px;height:76px;font-size:46px">?</div>If all photosynthetic organisms suddenly disappeared from Earth, what would happen to life?</div>
  <div class="row" style="margin:26px 0;gap:20px"><button class="btn blue" id="fnt">⏱ Start 60-second think time</button><div id="fntime" style="font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--blue)"></div></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:26px">
   <div class="card rv" data-s="1"><div style="font-size:56px">🍽️</div><h3>No new food</h3><p>Plants make food for all. Animals eat plants, or animals that eat plants — food chains would collapse.</p></div>
   <div class="card rv" data-s="2"><div style="font-size:56px">🫁</div><h3>Oxygen runs out</h3><p>Photosynthesis releases oxygen. Without it, the oxygen used in respiration would not be replaced.</p></div>
   <div class="card rv" data-s="3"><div style="font-size:56px">🌫️</div><h3>Carbon dioxide builds up</h3><p>Carbon dioxide from respiration would no longer be used — the balance in nature would be lost.</p></div></div>
  <div class="concl rv" data-s="4" style="margin-top:26px;font-size:30px">Photosynthesis and respiration together keep the <b>balance in nature</b>. Life on Earth depends on photosynthesis.</div>`,
 init(el,o){$('#fnt',el).onclick=()=>{o._bag.clear();let n=60;$('#fntime',el).textContent=n+' s';const id=setInterval(()=>{n--;$('#fntime',el).textContent=n>0?n+' s':'Time’s up!';if(n<=0)clearInterval(id);},1000);o._bag.add(()=>clearInterval(id));};},
 enter(el){$('#fntime',el).textContent='';}
});
S({id:'end',sec:'Final challenge',title:'Every leaf is a tiny food factory',bare:true,cls:'full',
 notes:'Close the lesson. Optional homework: start a bottle garden or the warm vs cold water-transport experiment (textbook Q9).',
 html:`<svg viewBox="0 0 1920 984" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%"><rect width="1920" height="984" fill="url(#gSky)"/>${ART.sun(1700,140,70)}
  <path d="M0 800Q480 740 960 790T1920 770V984H0Z" fill="#94D6A8"/><path d="M0 880Q600 850 1200 880T1920 870V984H0Z" fill="#5DBB7C"/>
  <g class="sway">${ART.plant(1500,880,{g:1,H:560})}</g></svg>
  <div style="position:absolute;left:120px;top:200px;width:1150px" class="col">
   <div class="kicker">Remember</div>
   <p style="font-size:66px;line-height:1.18;font-weight:800;letter-spacing:-.02em">Every leaf is a tiny <span class="g">food factory</span>.<br>Every root is a <span class="bl">gateway</span>.<br>Every plant is a <span style="color:#C67A12">living system</span>.</p>
   <div class="ctrls" style="margin-top:30px"><button class="btn pri" onclick="go(0,'back')">⌂ Back to start</button><button class="btn" onclick="toc(true)">☰ Chapter map</button></div></div>`
});
