<title>Mirrors and Lenses Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Optical lab theme: a dark room so light rays read clearly on a classroom TV.
   Fixed 1920x1080 stage scaled to fit any screen. */
:root{
  color-scheme: dark;
  --bg:#04060b;
  --bg2:#0a0e17;
  --panel:rgba(18,24,38,.78);
  --panel2:rgba(28,36,56,.9);
  --line:rgba(160,180,220,.16);
  --line2:rgba(160,180,220,.3);
  --ink:#eef2f8;
  --mute:#9fabbf;
  --dim:#6b778c;
  --ray:#ffcf6b;      /* light */
  --inc:#ffb547;      /* incident ray */
  --ref:#56dcff;      /* reflected ray */
  --r3:#ff7ad9;
  --obj:#ff8a5c;      /* object */
  --real:#7ef0a8;     /* real image */
  --virt:#b9a6ff;     /* virtual image */
  --warn:#ff5d5d;
  --acc:#8fb0ff;
  --f-ui:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono","IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="light"]){ color-scheme: dark; } }
:root[data-theme="dark"]{ color-scheme: dark; }
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:26px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;color:inherit}
#viewport{position:fixed;inset:0;background:#000}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;overflow:clip;
  background:radial-gradient(1200px 700px at 60% 40%,#0d1424 0%,#070a12 55%,#04060b 100%)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:50;
  background:radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.45) 100%)}

/* ---------- frames ---------- */
#frames{position:absolute;inset:0 0 84px 0}
.frame{position:absolute;inset:0;opacity:0;visibility:hidden;
  transition:opacity .75s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1),filter .75s,visibility 0s .9s;
  transform:translateX(60px) scale(.985);filter:blur(6px)}
.frame.prev{transform:translateX(-60px) scale(.985)}
.frame.on{opacity:1;visibility:visible;transform:none;filter:none;transition-delay:.12s,.12s,.12s,0s}
.fh{position:absolute;left:64px;top:34px;right:64px;z-index:3;pointer-events:none}
.kick{font:600 20px/1 var(--f-mono);letter-spacing:.18em;color:var(--ray);text-transform:uppercase;display:flex;gap:14px;align-items:center}
.kick b{display:inline-block;padding:7px 12px;border:1px solid rgba(255,207,107,.45);border-radius:999px;color:#ffe2a0;font-weight:600}
.fh h1{margin:14px 0 0;font-size:62px;line-height:1.02;font-weight:800;letter-spacing:-.025em}
.fh p{margin:10px 0 0;font-size:26px;color:var(--mute)}
.body{position:absolute;left:64px;right:64px;top:196px;bottom:22px}

/* ---------- canvases ---------- */
canvas.cv{display:block;touch-action:none;border-radius:22px}
.glass{background:linear-gradient(180deg,rgba(14,19,31,.85),rgba(8,11,19,.85));border:1px solid var(--line);border-radius:24px;
  box-shadow:0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05)}
.abs{position:absolute}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:16px}

/* ---------- side panel ---------- */
.side{position:absolute;right:0;top:0;bottom:0;width:440px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px 20px;backdrop-filter:blur(10px)}
.card h3{margin:0 0 10px;font:600 18px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.card p{margin:0;font-size:23px;color:#d5dceb}
.card p+p{margin-top:10px}
.big{font-size:30px;font-weight:700}
.hl{color:var(--ray)} .hc{color:var(--ref)} .hr{color:var(--real)} .hv{color:var(--virt)} .ho{color:var(--obj)} .hw{color:var(--warn)} .hp{color:var(--r3)}

/* readouts */
.ro{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:baseline}
.ro .k{font-size:21px;color:var(--mute);white-space:nowrap}
.ro .v{font:600 24px/1.15 var(--f-mono);text-align:right;transition:color .3s;white-space:nowrap}
.ro .v.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(1.12)}100%{transform:none}}

/* controls */
.ctl{display:flex;flex-direction:column;gap:8px}
.ctl .lab{display:flex;justify-content:space-between;font-size:21px;color:var(--mute)}
.ctl .lab b{font:600 22px var(--f-mono);color:var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--ray) var(--p,50%),rgba(255,255,255,.14) var(--p,50%))}
input[type=range]::-moz-range-track{height:10px;border-radius:6px;background:rgba(255,255,255,.14)}
input[type=range]::-moz-range-progress{height:10px;border-radius:6px;background:var(--ray)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;margin-top:-14px;background:#fff;border:0;box-shadow:0 0 0 6px rgba(255,207,107,.25),0 4px 14px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:38px;height:38px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 6px rgba(255,207,107,.25)}
input[type=range]:focus-visible{outline:3px solid var(--acc);outline-offset:4px;border-radius:8px}
.seg{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:5px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:12px;padding:12px 10px;font-size:21px;font-weight:600;color:var(--mute);cursor:pointer;transition:background .25s,color .25s;white-space:nowrap}
.seg button.on{background:#fff;color:#0a0e17}
.seg button:hover:not(.on){color:var(--ink);background:rgba(255,255,255,.07)}
.btn{border:1px solid var(--line2);background:rgba(255,255,255,.06);border-radius:16px;padding:14px 22px;font-size:22px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.13)}
.btn.pri{background:var(--ray);color:#1a1205;border-color:transparent}
.btn.pri:hover{filter:brightness(1.1)}
.btn.on{background:#fff;color:#0a0e17}
.btn:focus-visible,.seg button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.tog{display:flex;align-items:center;gap:14px;cursor:pointer;font-size:22px;color:#d5dceb;user-select:none}
.tog i{width:58px;height:32px;border-radius:20px;background:rgba(255,255,255,.16);position:relative;transition:background .25s;flex:none}
.tog i::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s}
.tog.on i{background:var(--ray)} .tog.on i::after{transform:translateX(26px)}

/* discovery */
.disc{background:linear-gradient(160deg,rgba(143,176,255,.16),rgba(18,24,38,.86));border:1px solid rgba(143,176,255,.4)}
.disc .dtag{font:600 17px/1 var(--f-mono);letter-spacing:.2em;color:var(--acc);margin-bottom:10px}
.disc .dp{font-size:22px;font-weight:800;letter-spacing:.02em;margin-bottom:8px}
.disc .dq{font-size:22px;color:#e6ebf6;min-height:30px;transition:opacity .3s}
.disc .dans{display:none;margin-top:10px;font-size:21px;color:#dfe6f3;border-top:1px solid var(--line);padding-top:12px}
.disc.rev .dans{display:block;animation:fadeup .5s}
.disc .row{margin-top:12px}
.disc .btn{padding:8px 14px;font-size:19px}
.disc .row{margin-top:10px}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* warning */
.warn{display:flex;gap:14px;align-items:flex-start;background:rgba(255,70,70,.12);border:1px solid rgba(255,93,93,.55);border-radius:18px;padding:12px 16px;font-size:21px;color:#ffd9d9}
.warn .wi{flex:none;width:40px;height:40px;border-radius:50%;background:var(--warn);color:#fff;display:grid;place-items:center;font-weight:900;font-size:26px}
.warn b{color:#fff}

/* bottom bar */
#bar{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;align-items:center;gap:16px;padding:0 28px;
  border-top:1px solid var(--line);background:rgba(4,6,11,.88);z-index:20;transition:opacity .4s}
#bar .chap{font:600 18px var(--f-mono);letter-spacing:.14em;color:var(--mute);white-space:nowrap}
#bar .chap b{color:var(--ray)}
#dots{flex:1;display:flex;gap:4px;align-items:center;justify-content:center}
#dots button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--dim);font:600 14px var(--f-mono);cursor:pointer;padding:0;transition:all .25s}
#dots button.seen{color:var(--mute);border-color:var(--line2)}
#dots button.cur{background:var(--ray);color:#140e02;border-color:transparent;transform:scale(1.12)}
.nb{white-space:nowrap;border:1px solid var(--line2);background:rgba(255,255,255,.05);border-radius:14px;height:56px;padding:0 18px;font-size:21px;font-weight:600;cursor:pointer}
.nb:hover{background:rgba(255,255,255,.12)}
.nb.pri{background:#fff;color:#0a0e17;border-color:#fff}
#count{font:500 18px var(--f-mono);color:var(--mute);min-width:76px;text-align:center}
body.pres #bar{opacity:0} body.pres #bar:hover{opacity:1}

/* chapter map overlay */
#map{position:absolute;inset:0;z-index:40;background:rgba(3,5,9,.94);backdrop-filter:blur(14px);display:none;padding:60px 70px}
#map.on{display:block;animation:fadeup .4s}
#map h2{margin:0 0 30px;font-size:46px;font-weight:800;letter-spacing:-.02em}
#map .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
#map .it{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:16px;padding:14px 18px;cursor:pointer;font-size:21px;display:flex;gap:14px;align-items:center}
#map .it:hover{background:rgba(255,207,107,.12);border-color:rgba(255,207,107,.5)}
#map .it span{font:600 17px var(--f-mono);color:var(--ray);flex:none;width:46px}
#map .it.cur{background:rgba(255,207,107,.16);border-color:var(--ray)}
#map .close{position:absolute;right:60px;top:56px}
#map .keys{margin-top:26px;color:var(--mute);font-size:20px}

/* tiles (applications) */
.tiles{display:grid;gap:14px}
.tile{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:20px;padding:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .25s;font-size:20px;font-weight:600;color:#d8dfec}
.tile canvas{border-radius:14px}
.tile:hover{border-color:var(--line2);background:rgba(255,255,255,.07)}
.tile.on{border-color:var(--ray);background:rgba(255,207,107,.1);color:#fff}
.zoomin{animation:zoomin .8s cubic-bezier(.2,.7,.2,1)}
@keyframes zoomin{from{opacity:0;transform:scale(.86);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

table.t101{width:100%;border-collapse:collapse;font-size:22px}
table.t101 th{font:600 16px var(--f-mono);letter-spacing:.1em;color:var(--mute);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2)}
table.t101 td{padding:7px 8px;border-bottom:1px solid var(--line);font-family:var(--f-mono)}
table.t101 tr.new td{animation:fadeup .5s}

/* buttons floating on a canvas */
.onc{position:absolute;left:20px;bottom:20px;display:flex;gap:10px;align-items:center;z-index:2}
.onc .btn{background:rgba(10,14,23,.85);backdrop-filter:blur(6px)}
.onc .tog{background:rgba(10,14,23,.85);padding:10px 16px;border-radius:16px;border:1px solid var(--line2)}
.topc{position:absolute;left:20px;top:18px;z-index:2}
.topc .seg{background:rgba(10,14,23,.88);backdrop-filter:blur(6px)}

</style>
<div id="viewport">
<div id="stage">
  <div id="frames"></div>
  <div id="bar">
    <div class="chap">CH 10 · <b>MIRRORS &amp; LENSES</b></div>
    <button class="nb" id="mapbtn" title="Chapter map (M)">☰ Map</button>
    <div id="dots" aria-label="Modules"></div>
    <div id="count"></div>
    <button class="nb" id="prev" aria-label="Previous">◀ Back</button>
    <button class="nb pri" id="next" aria-label="Next">Next ▶</button>
  </div>
  <div id="map" role="dialog" aria-label="Chapter map">
    <button class="nb close" id="mapclose">Close ✕</button>
    <h2>Light: Mirrors and Lenses — chapter map</h2>
    <div class="grid" id="mapgrid"></div>
    <div class="keys"><b>→ / PgDn</b> next · <b>← / PgUp</b> back · <b>M</b> map · <b>L</b> labels on/off · <b>F</b> fullscreen · <b>P</b> presentation mode (hides this bar)</div>
  </div>
</div>
</div>

<script>
'use strict';
/* ================= Frame engine =================
   Every screen is a "frame": {mod, title, sub, build(root,f), enter(f), leave(f), tick(f,dt,t)}.
   Frames build lazily, transition with a cinematic cross-fade, and only the visible
   frame is animated. */
const W = 1920, H = 1080, TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const $ = (s, r = document) => r.querySelector(s);

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}

const App = { scale: 1, ratio: 1, frames: [], cur: -1, canvases: new Set(), speed: 1, labels: true, t: 0, busy: [] };

/* ---------- canvases ---------- */
function canvas(parent, w, hh, style) {
  const cv = h('canvas', { class: 'cv', style: `width:${w}px;height:${hh}px;${style || ''}` });
  cv._w = w; cv._h = hh;
  parent && parent.append(cv);
  App.canvases.add(cv); sizeCanvas(cv);
  return { cv, ctx: cv.getContext('2d'), w, h: hh };
}
function sizeCanvas(cv) { cv.width = Math.round(cv._w * App.ratio); cv.height = Math.round(cv._h * App.ratio); }
function begin(c, bg) {
  const x = c.ctx; x.setTransform(c.cv.width / c.w, 0, 0, c.cv.height / c.h, 0, 0);
  x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; x.setLineDash([]); x.filter = 'none';
  if (bg) { x.fillStyle = bg; x.fillRect(0, 0, c.w, c.h); } else x.clearRect(0, 0, c.w, c.h);
  return x;
}
/* pointer helper: down(p) returns true to start a drag; move(p) while dragging; hover(p) returns true to show grab cursor */
function pointer(c, o) {
  const pos = e => { const r = c.cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * c.w / r.width, y: (e.clientY - r.top) * c.h / r.height }; };
  let drag = false;
  c.cv.addEventListener('pointerdown', e => {
    const p = pos(e);
    if (o.down && o.down(p, e)) { drag = true; c.cv.setPointerCapture(e.pointerId); c.cv.style.cursor = 'grabbing'; e.preventDefault(); }
  });
  c.cv.addEventListener('pointermove', e => {
    const p = pos(e);
    if (drag) { o.move && o.move(p, e); return; }
    if (o.hover) c.cv.style.cursor = o.hover(p) ? 'grab' : 'default';
  });
  const end = e => { if (drag) { drag = false; c.cv.style.cursor = 'grab'; o.up && o.up(pos(e)); } };
  c.cv.addEventListener('pointerup', end); c.cv.addEventListener('pointercancel', end);
}

/* ---------- frames ---------- */
function frame(def) { App.frames.push(def); }

function buildFrame(f) {
  const root = h('section', { class: 'frame' });
  if (f.title) root.append(h('header', { class: 'fh' },
    h('div', { class: 'kick' }, f.mod != null ? h('b', null, f.mod === 'intro' ? 'CHAPTER 10' : 'MODULE ' + String(f.mod).padStart(2, '0')) : null, f.kick || ''),
    h('h1', { html: f.title }), f.sub ? h('p', { html: f.sub }) : null));
  const body = h('div', { class: 'body' }); root.append(body);
  $('#frames').append(root);
  f.root = root; f.body = body; f.t = 0;
  f.build && f.build(body, f);
  f.built = true;
}

function go(i) {
  i = clamp(i, 0, App.frames.length - 1);
  if (i === App.cur) return;
  const dir = i > App.cur ? 1 : -1;
  const old = App.frames[App.cur], nf = App.frames[i];
  if (!nf.built) buildFrame(nf);
  if (old) {
    old.root.classList.remove('on'); old.root.classList.toggle('prev', dir > 0);
    old.leave && old.leave(old);
    App.busy.push({ f: old, until: performance.now() + 900 });
  }
  nf.root.classList.toggle('prev', dir < 0);
  void nf.root.offsetWidth;
  nf.root.classList.add('on'); nf.root.classList.remove('prev');
  App.cur = i; nf.seen = true; nf.t = 0;
  nf.enter && nf.enter(nf);
  updateBar();
  try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) { }
}

function updateBar() {
  const f = App.frames[App.cur];
  $('#count').textContent = (App.cur + 1) + ' / ' + App.frames.length;
  document.querySelectorAll('#dots button').forEach(b => {
    const m = b.dataset.m;
    b.classList.toggle('cur', String(f.mod) === m);
    b.classList.toggle('seen', App.frames.some(x => x.seen && String(x.mod) === m));
  });
  document.querySelectorAll('#mapgrid .it').forEach((b, k) => b.classList.toggle('cur', k === App.cur));
  $('#prev').disabled = App.cur === 0; $('#next').disabled = App.cur === App.frames.length - 1;
}

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  App.scale = s;
  $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`;
  const r = clamp(s * (devicePixelRatio || 1), 1, 2);
  if (Math.abs(r - App.ratio) > .01) { App.ratio = r; App.canvases.forEach(sizeCanvas); }
}

function loop(now) {
  const dt = Math.min(.05, (now - (App.last || now)) / 1000); App.last = now; App.t += dt;
  const f = App.frames[App.cur];
  App.busy = App.busy.filter(b => b.until > now && b.f !== f);
  for (const b of App.busy) b.f.tick && b.f.tick(b.f, dt, b.f.t);
  if (f) { f.t += dt; f.tick && f.tick(f, dt, f.t); }
  requestAnimationFrame(loop);
}

function boot() {
  // modules may be defined in any file order; present them in module order (stable sort)
  const key = f => f.mod === 'intro' ? 0 : +f.mod;
  App.frames.sort((a, b) => key(a) - key(b));
  // module chips in the bar and map
  const mods = []; App.frames.forEach(f => { if (f.mod != null && !mods.includes(String(f.mod))) mods.push(String(f.mod)); });
  const dots = $('#dots');
  mods.forEach(m => dots.append(h('button', {
    'data-m': m, title: m === 'intro' ? 'Introduction' : 'Module ' + m,
    onclick: () => go(App.frames.findIndex(f => String(f.mod) === m))
  }, m === 'intro' ? '◎' : String(m).padStart(2, '0'))));
  const grid = $('#mapgrid');
  App.frames.forEach((f, k) => grid.append(h('button', { class: 'it', onclick: () => { closeMap(); go(k); } },
    h('span', null, f.mod === 'intro' ? '—' : String(f.mod).padStart(2, '0')), (f.mapTitle || f.title || '').replace(/<[^>]+>/g, ''))));
  $('#prev').onclick = () => go(App.cur - 1);
  $('#next').onclick = () => go(App.cur + 1);
  $('#mapbtn').onclick = openMap; $('#mapclose').onclick = closeMap;
  addEventListener('resize', fit); fit();
  // focusing a control must never scroll the fixed stage
  for (const el of [$('#stage'), $('#frames'), $('#viewport')]) el.addEventListener('scroll', () => { el.scrollTop = 0; el.scrollLeft = 0; });
  addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { go(App.cur + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(App.cur - 1); e.preventDefault(); }
    else if (e.key === 'm' || e.key === 'M') $('#map').classList.contains('on') ? closeMap() : openMap();
    else if (e.key === 'Escape') closeMap();
    else if (e.key === 'f' || e.key === 'F') { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); else document.exitFullscreen(); }

/* ---------- ideal bench ---------- */

function bench(x, B) {

  dashLine(x, O[0] - n[0] * 70, O[1] - n[1] * 70, O[0], O[1], 'rgba(232,238,252,.3)', 2, [6, 8]);

  const q = 22; x.moveTo(O[0] + mt[0] * q, O[1] + mt[1] * q); x.lineTo(O[0] + mt[0] * q + n[0] * q, O[1] + mt[1] * q + n[1] * q); x.lineTo(O[0] + n[0] * q, O[1] + n[1] * q); x.stroke(); x.restore();

  // rays
  const fl = t * 120 * App.speed;
  const along = Math.abs(st.th) < .5;
  const off = along ? [mt[0] * 7, mt[1] * 7] : [0, 0];
  beam(x, [[S[0] - off[0], S[1] - off[1]], [O[0] - off[0], O[1] - off[1]]], COL.inc, { flow: fl, w: 3.2 });
  beam(x, [[O[0] + off[0], O[1] + off[1]], [E[0] + off[0], E[1] + off[1]]], COL.ref, { flow: fl - L, w: 3.2 });

/* ---------- MODULE 2: spherical mirrors in 3-D ---------- */
function capMesh(type) {
  const Rs = 300, tm = 36 * DEG, NT = 12, NP = 40, quads = [];
  const sg = type === 'concave' ? -1 : 1;       // concave: cap around -z so its inside faces the viewer at +z
  const zc = sg * Rs * (1 + Math.cos(tm)) / 2;  // shift so the cap sits at the origin
  const P = (i, j) => { const th = tm * i / NT, ph = TAU * j / NP; return [Rs * Math.sin(th) * Math.cos(ph), Rs * Math.sin(th) * Math.sin(ph), sg * Rs * Math.cos(th)]; };
  for (let i = 0; i < NT; i++) for (let j = 0; j < NP; j++) {
    const ps = [P(i, j), P(i + 1, j), P(i + 1, j + 1), P(i, j + 1)];
    const cpt = ps.reduce((a, p) => [a[0] + p[0] / 4, a[1] + p[1] / 4, a[2] + p[2] / 4], [0, 0, 0]);
    const L = Math.hypot(...cpt);
    quads.push({ ps: ps.map(p => [p[0], p[1], p[2] - zc]), n: cpt.map(v => v / L) });
  }
  const rim = []; for (let j = 0; j <= NP; j++) { const p = P(NT, j); rim.push([p[0], p[1], p[2] - zc]); }
  return { quads, rim, Rs, zc, type };
}
function rot3(p, yaw, pitch) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);

  return [x1, p[1] * cp - z1 * sp, p[1] * sp + z1 * cp];
}
function drawCap(c, mesh, cam, o) {

  const pr = p => { const s = D / (D - p[2]); return [cx + p[0] * s, cy + p[1] * s, p[2]]; };

  // floor glow
  glow(x, cx, cy + 40, 300, 'rgba(120,150,220,.12)');
  // imaginary sphere
  if (o.sphere) {
    const ctr = rot3([0, 0, -mesh.zc], cam.yaw, cam.pitch), pc = pr(ctr), s = D / (D - ctr[2]);

    x.beginPath(); x.arc(pc[0], pc[1], mesh.Rs * s, 0, TAU); x.stroke();
    x.setLineDash([]); x.strokeStyle = 'rgba(143,176,255,.14)';
    for (let k = 0; k < 3; k++) {

        j ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1]);
      }
      x.stroke();
    }
    x.restore();
    dot(x, pc[0], pc[1], 6, '#b9c9ff'); tag(x, 'C (centre of the hollow sphere)', pc[0], pc[1] + 26, { size: 18, col: '#b9c9ff' });
  }
  const L = norm([.3, -.7]); const L3 = [L[0] * .6, L[1] * .6, .55];
  const qs = mesh.quads.map(q => {
    const ps = q.ps.map(p => rot3(p, cam.yaw, cam.pitch)), n = rot3(q.n, cam.yaw, cam.pitch);

}

/* ---------- generic lab frame (Modules 3, 4, 10, 11) ---------- */
function labFrame(def) {
  frame({
    mod: def.mod, kick: def.kick, title: def.title, sub: def.sub, mapTitle: def.mapTitle,
    build(b, f) {
      f.u = def.u0; f.rays = 'principal'; f.glide = null;
      f.c = canvas(b, 1328, 778, 'position:absolute;left:0;top:0'); f.c.cv.classList.add('glass');
      const near = p => Math.abs(p.x - f.info.xo) < 50 && p.y > f.info.ty - 30 && p.y < def.y0 + 30;
      pointer(f.c, {
        hover: near,
        down: p => { if (!near(p) && !(Math.abs(p.y - def.y0) < 60 && p.x < def.x0 - 10)) return false; f.glide = null; f.u = clamp(def.x0 - p.x, def.umin, def.umax); return true; },
        move: p => { f.u = clamp(def.x0 - p.x, def.umin, def.umax); }
      });
      const side = h('div', { class: 'side' }); b.append(side);
      f.ro = ui.readout([['obj', 'Object distance'], ['zone', 'Object position'], ['img', 'Image at'], ['size', 'Image size'], ['ori', 'Orientation'], ['kind', 'Image type']]);
      side.append(ui.card('Live measurements', f.ro));
      side.append(ui.card('Rays', ui.seg({ options: [{ v: 'principal', t: 'Key 3' }, { v: 5, t: '5' }, { v: 10, t: '10' }, { v: 20, t: '20' }], value: 'principal', onChange: v => f.rays = v })));
      f.onc = h('div', { class: 'onc' },
        ui.btn(def.glideTxt || 'Glide object ⟶', () => { f.glide = { t: 0 }; }),
        ui.btn('Reset', () => { f.glide = null; f.u = def.u0; }));
      b.append(f.onc);
      side.append(ui.discover(def.disc));
      if (def.extra) def.extra(b, f, side);
    },
    tick(f, dt, t) {
      if (f.glide) { f.glide.t += dt * .07 * App.speed; const k = f.glide.t; f.u = lerp(def.umax, def.umin, ease(clamp(k, 0, 1))); if (k >= 1) f.glide = null; }
      const x = begin(f.c); bgGrid(x, f.c.w, f.c.h);
      const B = { type: def.type, x0: def.x0, y0: def.y0, f: def.f, u: f.u, h: def.oh || 90, A: def.A || 440, w: f.c.w, h2: f.c.h, rays: f.rays, flow: t * 110 * App.speed };
      f.info = bench(x, B);
      offscreenHint(x, f.info, f.c.w, def.y0);
      if (def.overlay) def.overlay(x, f, t);
      tag(x, '⟵ drag ⟶', f.info.xo, def.y0 + 96, { size: 18, col: 'rgba(255,255,255,.55)', bg: false });
      const d = describe(def.type, f.info, f.u, def.f);
      f.ro.set('obj', d.obj); f.ro.set('zone', d.zone || 'anywhere');
      f.ro.set('img', d.where, d.col); f.ro.set('size', d.size); f.ro.set('ori', d.ori, d.ocol); f.ro.set('kind', d.kind, d.col);
    }
  });
}
function offscreenHint(x, info, w, y0) {
  if (info.show || info.inf) return;
  if (info.xi < 0) tag(x, '◀ image far to the left (off screen)', 20, y0 - 40, { align: 'left', size: 20, col: COL.real, need: true });
  else if (info.xi > w) tag(x, 'image far behind ▶', w - 20, y0 - 40, { align: 'right', size: 20, col: COL.virt, need: true });
}

/* ---------- MODULE 8: concentration of light ---------- */
function sunScene(x, w, hh, t) {
  const sky = x.createLinearGradient(0, 0, 0, hh); sky.addColorStop(0, '#0e1d33'); sky.addColorStop(.75, '#1a2a3a'); sky.addColorStop(1, '#22311f');
  x.fillStyle = sky; x.fillRect(0, 0, w, hh);
  drawSun(x, 150, 90, 46, t);
}
/* auto-focus: scan distances and return the one giving the narrowest spot */
function bestFocus(spot, lo, hi) {
  let best = lo, bw = 1e9;
  for (let d = lo; d <= hi; d += 1) { const s = spot(d); if (s.n >= s.N * .6 && s.w < bw) { bw = s.w; best = d; } }
  return best;
}
const SUNM = { al: 26 * DEG, R: 660, A: 240, V: [840, 610], N: 30, span: 104 };
function sunMirrorSpot(dp) {
  const { al, R, A, V, N } = SUNM, ax = [-Math.sin(al), -Math.cos(al)], rC = [-Math.sin(2 * al), -Math.cos(2 * al)], pr = [-rC[1], rC[0]];
  const Pc = [V[0] + rC[0] * dp, V[1] + rC[1] * dp], half = 70;
  const card = { kind: 'absorb', geom: 'seg', a: [Pc[0] - pr[0] * half, Pc[1] - pr[1] * half], b: [Pc[0] + pr[0] * half, Pc[1] + pr[1] * half], id: 'card' };
  const ground = { kind: 'absorb', geom: 'seg', a: [-10, 720], b: [1400, 720], id: 'ground' };
  const ms = mirrorSurf('concave', V, ax, R, A), rays = [], hits = [];
  for (let k = 0; k < N; k++) {
    const r = trace([V[0] - SUNM.span + 2 * SUNM.span * k / (N - 1), -10], [0, 1], [ms, card, ground], { len: 1400, max: 4 });
    r.reflected = r.pts.length >= 3; rays.push(r);
    if (r.hit && r.hit.s.id === 'card' && r.reflected) hits.push((r.hit.q[0] - Pc[0]) * pr[0] + (r.hit.q[1] - Pc[1]) * pr[1]);
  }
  const w = hits.length ? Math.max(...hits) - Math.min(...hits) : 1e9;
  return { rays, hits, w, n: hits.length, N, Pc, pr, rC, ax, card };
}

/* ================= Modules 9–12, 15, 16: lenses ================= */

/* 2.5-D picture of a lens (like Fig. 10.15a / 10.16a) */
function drawLens3D(x, cx, cy, R, k) {
  // k > 0 convex (thick middle), k < 0 concave (thick edge), 0 flat plate
  const rim = 18 + Math.max(0, -k) * 34, bulge = Math.max(0, k) * 46, dip = Math.max(0, -k) * 30;
  x.save();
  // edge band
  const eg = x.createLinearGradient(0, cy - R * .35, 0, cy + R * .35 + rim);
  eg.addColorStop(0, 'rgba(110,190,170,.55)'); eg.addColorStop(1, 'rgba(40,110,100,.75)');
  x.fillStyle = eg; x.beginPath(); x.ellipse(cx, cy + rim, R, R * .32, 0, 0, Math.PI); x.lineTo(cx - R, cy); x.ellipse(cx, cy, R, R * .32, 0, Math.PI, 0, true); x.closePath(); x.fill();
  // top face
  const tg = x.createRadialGradient(cx - R * .3, cy - R * .12 - bulge * .5, 4, cx, cy, R);
  tg.addColorStop(0, 'rgba(235,250,255,.75)'); tg.addColorStop(.5, 'rgba(150,215,225,.35)'); tg.addColorStop(1, 'rgba(90,170,170,.5)');
  x.fillStyle = tg; x.beginPath(); x.ellipse(cx, cy, R, R * .32, 0, 0, TAU); x.fill();
  x.strokeStyle = 'rgba(220,250,255,.8)'; x.lineWidth = 2; x.stroke();
  // curvature cue
  x.globalCompositeOperation = 'lighter';
  if (bulge) { x.fillStyle = `rgba(255,255,255,${.12 + k * .12})`; x.beginPath(); x.ellipse(cx - R * .25, cy - R * .06, R * .45, R * .1, -.08, 0, TAU); x.fill(); }
  if (dip) { x.strokeStyle = 'rgba(255,255,255,.35)'; x.lineWidth = 3; x.beginPath(); x.ellipse(cx, cy, R * .82, R * .25, 0, Math.PI * 1.1, Math.PI * 1.9); x.stroke(); }
  x.restore();
}

});

function beamFrame(def) {
  frame({
    mod: def.mod, kick: def.kick, title: def.title, sub: def.sub, mapTitle: def.mapTitle,
    build(b, f) {
      f.n = 10; f.fl = 280; f.cross = false;
      f.c = canvas(b, 1328, 778, 'position:absolute;left:0;top:0'); f.c.cv.classList.add('glass');
      const side = h('div', { class: 'side' }); b.append(side);
      side.append(ui.card('Rays', ui.seg({ options: [1, 5, 10, 20].map(v => ({ v, t: v + '' })), value: 10, onChange: v => f.n = v })));
      side.append(ui.card('Lens', ui.slider({ label: 'Focal length (curvature)', min: 230, max: 420, value: 280, fmt: v => (v / PX_CM).toFixed(0) + ' cm', onInput: v => f.fl = v }),
        h('p', { style: 'margin-top:10px;font-size:21px;color:var(--mute)' }, 'More curved surfaces → shorter focal length.')));
      side.append(ui.card(null, h('p', { html: def.note })));
      if (def.disc) side.append(ui.discover(def.disc));
    },
    tick(f, dt, t) {
      const x = begin(f.c); bgGrid(x, f.c.w, f.c.h);
      const x0 = def.x0, cy = 380, A = 280, L = makeLens(def.type, x0, cy, A, f.fl), fl = t * 110 * App.speed, lab = App.labels;
      dashLine(x, 0, cy, f.c.w, cy, COL.axis, 1.5, [14, 10]);
      drawGlass(x, L.outline);
      const cr = [];
      for (let k = 0; k < f.n; k++) {
        const y = f.n === 1 ? cy - 80 : cy - 115 + 230 * k / (f.n - 1);
        const r = trace([0, y], [1, 0], L.surfs, { len: 1400 });
        beam(x, r.pts, COL.ray, { flow: fl, w: f.n > 10 ? 1.6 : 2.2, as: 10 });
        const last = r.pts[r.pts.length - 2];
        if (Math.abs(y - cy) > 2 && Math.abs(r.dir[1]) > 1e-4) {
          const tA = (cy - last[1]) / r.dir[1];
          if (def.type === 'convexLens' ? tA > 0 : tA < 0) cr.push(last[0] + r.dir[0] * tA);
          if (def.type === 'concaveLens' && tA < 0) beam(x, [last, [last[0] + r.dir[0] * tA, cy]], COL.ray, { dash: [7, 8], a: .5 });
        }
      }
      // focal points (thin lens) and the focal region (where the real rays actually cross)
      const F1 = x0 - f.fl, F2 = x0 + f.fl;
      if (cr.length) {
        const mn = Math.min(...cr), mx = Math.max(...cr);
        x.save(); x.globalCompositeOperation = 'lighter';
        const g = x.createLinearGradient(mn - 20, 0, mx + 20, 0); g.addColorStop(0, 'rgba(255,220,140,0)'); g.addColorStop(.5, 'rgba(255,220,140,.35)'); g.addColorStop(1, 'rgba(255,220,140,0)');
        x.fillStyle = g; x.beginPath(); x.ellipse((mn + mx) / 2, cy, (mx - mn) / 2 + 26, 30, 0, 0, TAU); x.fill(); x.restore();
        if (lab && f.n > 1) tag(x, def.type === 'convexLens' ? 'Focal region — rays cross here' : 'Rays seem to come from here', (mn + mx) / 2, cy + 74, { size: 21, col: COL.ray });
      }
      [[F1, 'F'], [F2, "F'"]].forEach(([X, s]) => { dot(x, X, cy, 6, '#fff'); if (lab) tag(x, s, X, cy + 30, { size: 22, weight: 700 }); });
      dot(x, x0, cy, 6, COL.ref);
      if (lab) {
        tag(x, 'Optical centre O', x0, cy - A / 2 - 34, { size: 21, col: COL.ref });
        tag(x, 'Principal axis', f.c.w - 110, cy - 24, { size: 20, col: COL.mute, bg: false });
        tag(x, 'Parallel rays', 120, cy - 150, { size: 22, col: COL.ray });
        tag(x, `Focal length = ${(f.fl / PX_CM).toFixed(0)} cm`, def.type === 'convexLens' ? (x0 + F2) / 2 : (x0 + F1) / 2, cy + 190, { size: 20, col: COL.mute });
        const fx = def.type === 'convexLens' ? F2 : F1; dashLine(x, x0, cy + 160, fx, cy + 160, 'rgba(255,255,255,.35)', 1.5, [4, 5]);
      }
    }
  });
}

  r.targets.forEach(p => { if (inFan(rays, p) >= 0) { x.strokeStyle = '#7ef0a8'; x.lineWidth = 4; x.beginPath(); x.arc(p[0], p[1], 62, 0, TAU); x.stroke(); } });
  x.restore();
}
function sideIcon(x, w, hh) { x.fillStyle = '#2b2f38'; x.beginPath(); x.ellipse(w / 2, hh / 2, 72, 46, -.15, 0, TAU); x.fill(); const g = x.createLinearGradient(w / 2 - 60, 0, w / 2 + 60, 0); g.addColorStop(0, '#7fb6ff'); g.addColorStop(1, '#c9e2ff'); x.fillStyle = g; x.beginPath(); x.ellipse(w / 2, hh / 2, 62, 37, -.15, 0, TAU); x.fill(); x.fillStyle = '#e04a3a'; x.fillRect(w / 2 - 12, hh / 2 - 6, 24, 14); }
function roadIcon(x, w, hh) { x.strokeStyle = '#ff9a2f'; x.lineWidth = 8; x.beginPath(); x.arc(w / 2, hh / 2 - 10, 38, 0, TAU); x.stroke(); x.fillStyle = '#c9e2ff'; x.beginPath(); x.arc(w / 2, hh / 2 - 10, 33, 0, TAU); x.fill(); x.fillStyle = '#8b93a3'; x.fillRect(w / 2 - 4, hh / 2 + 28, 8, 40); }
function storeIcon(x, w, hh) { const g = x.createRadialGradient(w / 2 - 15, hh / 2 - 15, 4, w / 2, hh / 2, 55); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#5e6b80'); x.fillStyle = g; x.beginPath(); x.arc(w / 2, hh / 2, 52, 0, TAU); x.fill(); x.strokeStyle = '#2b2f38'; x.lineWidth = 6; x.stroke(); }

function appFrame(def) {
  frame({
    mod: def.mod, kick: def.kick, title: def.title, sub: def.sub, mapTitle: def.mapTitle,
    build(b, f) {
      f.sel = 0; f.st = { mode: 0 }; f.z = 0;
      const cols = def.items.length > 6 ? 2 : 2, tw = 280;
      const grid = h('div', { class: 'tiles abs', style: `left:0;top:0;width:${tw * cols + 14}px;grid-template-columns:repeat(${cols},${tw}px)` }); b.append(grid);
      f.tiles = def.items.map((it, i) => {
        const ic = canvas(null, 250, def.items.length > 6 ? 106 : 150); const x = begin(ic); it.icon(x, ic.w, ic.h);
        const tl = h('button', { class: 'tile', onclick: () => select(i) }, ic.cv, it.name); grid.append(tl); return tl;
      });
      const wrap = h('div', { class: 'abs', style: `left:${tw * cols + 40}px;top:0;right:0;bottom:0` }); b.append(wrap);
      const W2 = 1792 - (tw * cols + 40);
      f.dw = h('div', { class: 'glass', style: 'overflow:hidden' }); wrap.append(f.dw);
      f.c = canvas(f.dw, W2, 560);
      f.name = h('div', { class: 'big', style: 'font-size:34px' });
      f.text = h('p', { style: 'font-size:24px;margin-top:8px' });
      f.modes = h('div', { style: 'margin-top:12px' });
      wrap.append(h('div', { class: 'card', style: 'margin-top:16px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start' }, h('div', null, f.name, f.text), f.modes));
      function select(i) {
        f.sel = i; f.st = { mode: 0 }; f.z = 0;
        f.tiles.forEach((tl, k) => tl.classList.toggle('on', k === i));
        const it = def.items[i]; f.name.textContent = it.name; f.text.innerHTML = it.text;
        f.modes.innerHTML = ''; if (it.modes) f.modes.append(ui.seg({ options: it.modes.map((m, k) => ({ v: k, t: m })), value: 0, onChange: v => f.st.mode = v }));
        f.dw.classList.remove('zoomin'); void f.dw.offsetWidth; f.dw.classList.add('zoomin');
      }
      select(0);
    },
    tick(f, dt, t) {
      f.z = Math.min(1, f.z + dt * 1.1);
      const x = begin(f.c, '#0a0e17'); bgGrid(x, f.c.w, f.c.h, 50);
      const e = ease(f.z), s = lerp(1.35, 1, e);
      x.save(); x.translate(f.c.w / 2, f.c.h / 2); x.scale(s, s); x.translate(-f.c.w / 2, -f.c.h / 2);
      def.items[f.sel].scene(x, f.c.w, f.c.h, t * App.speed, f.st);
      x.restore();
    }
  });
}
appFrame({ mod: 17, kick: 'Where do we use lenses?', title: 'Lenses all around us', mapTitle: 'Lenses in real life', sub: 'Tap an object to look inside at its lens.', items: LENS_APPS });
appFrame({ mod: 18, kick: 'Where do we use mirrors?', title: 'Mirrors in real life', mapTitle: 'Mirrors in real life', sub: 'Tap an object to zoom into its optics and see why that mirror is used.', items: MIRROR_APPS });

/* ================= Modules 19–21: optical lab, discovery mode, recap ================= */
const TYPES = [
  { v: 'plane', t: 'Plane mirror', x0: 640 }, { v: 'concave', t: 'Concave mirror', x0: 760 }, { v: 'convex', t: 'Convex mirror', x0: 720 },
  { v: 'convexLens', t: 'Convex lens', x0: 620 }, { v: 'concaveLens', t: 'Concave lens', x0: 720 }];

/* ---------- MODULE 19: the optical lab ---------- */
frame({
  mod: 19, kick: 'Virtual experiment lab', title: 'The Optical Lab', mapTitle: 'Optical Lab: free experimentation',
  sub: 'Every control changes the simulation instantly. Drag the object on the bench too.',
  build(b, f) {
    const D = { type: 'concave', ucm: 30, hcm: 7, fcm: 15, rays: 'principal', on: true, labels: true, speed: 1 };
    f.s = Object.assign({}, D);
    f.c = canvas(b, 1190, 778, 'position:absolute;left:0;top:0'); f.c.cv.classList.add('glass');
    const near = p => Math.abs(p.x - f.info.xo) < 50 && p.y > f.info.ty - 30 && p.y < 430;
    pointer(f.c, { hover: near, down: p => near(p), move: p => { f.s.ucm = clamp((f.x0 - p.x) / PX_CM, 2, 55); f.cU.set(f.s.ucm); } });
    const side = h('div', { class: 'abs', style: 'left:1212px;top:0;width:580px;display:flex;flex-direction:column;gap:12px' }); b.append(side);
    f.ro = ui.readout([['obj', 'Object position'], ['img', 'Image position'], ['size', 'Image size'], ['ori', 'Orientation'], ['kind', 'Image type']]);
    side.append(ui.card('Live information', f.ro));
    f.cT = ui.seg({ options: TYPES.map(o => ({ v: o.v, t: o.t })), value: D.type, onChange: v => { f.s.type = v; } });
    f.cT2 = { set() { } };
    b.append(h('div', { class: 'topc' }, f.cT));
    f.cU = ui.slider({ label: 'Object position', min: 2, max: 55, step: .5, value: D.ucm, fmt: v => v.toFixed(1) + ' cm', onInput: v => f.s.ucm = v });
    f.cH = ui.slider({ label: 'Object height', min: 2, max: 12, step: .5, value: D.hcm, fmt: v => v.toFixed(1) + ' cm', onInput: v => f.s.hcm = v });
    f.cF = ui.slider({ label: 'Focal length', min: 8, max: 25, step: .5, value: D.fcm, fmt: v => v.toFixed(1) + ' cm', onInput: v => f.s.fcm = v });
    f.cR = ui.seg({ options: [{ v: 'principal', t: 'Key 3' }, { v: 1, t: '1' }, { v: 5, t: '5' }, { v: 10, t: '10' }, { v: 20, t: '20' }], value: 'principal', onChange: v => f.s.rays = v });
    f.cS = ui.slider({ label: 'Animation speed', min: 0, max: 3, step: .1, value: 1, fmt: v => v.toFixed(1) + '×', onInput: v => App.speed = v });
    f.tRay = ui.toggle({ label: 'Ray tracing', value: true, onChange: v => f.s.on = v });
    f.tLab = ui.toggle({ label: 'Labels', value: true, onChange: v => App.labels = v });
    side.append(ui.card('Controls', h('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:6px 22px' }, f.cU, f.cH, f.cF, f.cS),
      h('div', { class: 'ctl', style: 'margin-top:8px' }, h('div', { class: 'lab' }, h('span', null, 'Ray count')), f.cR),
      h('div', { class: 'row', style: 'margin-top:14px;justify-content:space-between' }, f.tRay, f.tLab,
        ui.btn('↺ Reset experiment', () => { f.s = Object.assign({}, D); f.cT.set(D.type); f.cT2.set(null); f.cU.set(D.ucm); f.cH.set(D.hcm); f.cF.set(D.fcm); f.cR.set('principal'); f.cS.set(1); App.speed = 1; f.tRay.set(true); f.tLab.set(true); App.labels = true; }))));
  },
  leave() { App.speed = 1; },
  tick(f, dt, t) {
    const s = f.s, T = TYPES.find(o => o.v === s.type); f.x0 = T.x0;
    const x = begin(f.c); bgGrid(x, f.c.w, f.c.h);
    const fp = s.fcm * PX_CM, u = s.ucm * PX_CM;
    const A = Math.min(460, s.type === 'concave' || s.type === 'convex' ? 4 * fp * .92 : 460);
    f.info = bench(x, { type: s.type, x0: T.x0, y0: 400, f: fp, u, h: s.hcm * PX_CM, A, w: f.c.w, h2: f.c.h, rays: s.rays, showRays: s.on, flow: App.t * 110 * App.speed });
    offscreenHint(x, f.info, f.c.w, 400);
    const d = describe(s.type, f.info, u, fp);
    f.ro.set('obj', d.obj + (d.zone ? ' · ' + d.zone : '')); f.ro.set('img', d.where, d.col); f.ro.set('size', d.size); f.ro.set('ori', d.ori, d.ocol); f.ro.set('kind', d.kind, d.col);
  }
});

/* ---------- MODULE 20: discovery mode — the mystery optic ---------- */
frame({
  mod: 20, kick: 'Discovery mode', title: 'What is hidden behind the screen?', mapTitle: 'Discovery mode: identify the hidden mirror or lens',
  sub: 'MOVE THE OBJECT AND OBSERVE the image. Then decide what is hidden.',
  build(b, f) {
    f.k = 1; f.u = 420; f.rev = false; f.obs = new Set(); f.guess = null;
    f.c = canvas(b, 1328, 778, 'position:absolute;left:0;top:0'); f.c.cv.classList.add('glass');
    const near = p => Math.abs(p.x - f.info.xo) < 50 && p.y > f.info.ty - 30 && p.y < 430;
    pointer(f.c, { hover: near, down: p => near(p) || (Math.abs(p.y - 400) < 50 && p.x < 680) ? (f.u = clamp(700 - p.x, 30, 680), true) : false, move: p => f.u = clamp(700 - p.x, 30, 680) });
    const side = h('div', { class: 'side' }); b.append(side);
    f.obsEl = h('div', { style: 'display:flex;flex-wrap:wrap;gap:8px;min-height:44px' });
    side.append(ui.card('Your observations', f.obsEl, h('p', { style: 'margin-top:10px;font-size:20px;color:var(--mute)' }, 'Collected automatically as you move the object.')));
    f.qs = h('div', { class: 'dq', style: 'font-size:24px' });
    side.append(h('div', { class: 'card disc' }, h('div', { class: 'dtag' }, 'THINK'), f.qs));
    f.btns = TYPES.map(o => ui.btn(o.t, () => { f.guess = o.v; f.btns.forEach(bb => bb.classList.toggle('on', bb === bt(o.v))); }));
    const bt = v => f.btns[TYPES.findIndex(o => o.v === v)];
    f.res = h('div', { class: 'big', style: 'margin-top:12px;min-height:40px' });
    side.append(ui.card('Your decision', h('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:8px' }, ...f.btns),
      h('div', { class: 'row', style: 'margin-top:12px;gap:8px' }, ui.btn('Reveal', () => { f.rev = true; }, 'pri'), ui.btn('New mystery', () => newMystery(f))), f.res));
    newMystery(f);
  },
  tick(f, dt, t) {
    const type = TYPES[f.k].v, x0 = 700;
    const x = begin(f.c); bgGrid(x, f.c.w, f.c.h);
    f.info = bench(x, { type, x0, y0: 400, f: 170, u: f.u, h: 80, A: 420, w: f.c.w, h2: f.c.h, rays: 'principal', showRays: f.rev, flow: t * 100 * App.speed, labels: f.rev, marks: f.rev });
    offscreenHint(x, f.info, f.c.w, 400);
    if (!f.rev) {
      x.save(); const g = x.createLinearGradient(x0 - 100, 0, x0 + 100, 0); g.addColorStop(0, '#28344e'); g.addColorStop(.5, '#465678'); g.addColorStop(1, '#28344e');
      x.fillStyle = g; rrect(x, x0 - 100, 120, 200, 560, 20); x.fill(); x.strokeStyle = 'rgba(143,176,255,.5)'; x.lineWidth = 2; x.stroke(); x.restore();
      tag(x, '?', x0, 400, { size: 110, weight: 800, col: 'rgba(255,255,255,.85)', bg: false, need: true });
    }
    const d = describe(type, f.info, f.u, 170);
    const add = s => { if (!f.obs.has(s)) { f.obs.add(s); f.obsEl.append(h('span', { style: 'padding:6px 14px;border-radius:999px;border:1px solid var(--line2);font-size:20px;animation:fadeup .4s' }, s)); } };
    if (!f.info.inf) { add(d.ori); add(d.sw); if (f.info.show) add(isLens(type) ? (f.info.real ? 'image beyond the screen' : 'image on object’s side') : (f.info.real ? 'image in front' : 'image behind the screen')); }
    const qi = Math.floor(t / 5) % 4;
    f.qs.textContent = ['What changed as you moved the object?', 'Did the image become larger or smaller?', 'Did it ever become inverted?', 'Where does the image appear?'][qi];
    if (f.rev) f.res.innerHTML = `It was a <span class="hl">${TYPES[f.k].t}</span>` + (f.guess ? (f.guess === type ? ' — <span class="hr">you were right!</span>' : ' — <span style="color:#ffb0a0">look at the clues again</span>') : '');
  }
});
function newMystery(f) {
  let k; do { k = Math.floor(Math.random() * TYPES.length); } while (k === f.k);
  f.k = k; f.rev = false; f.guess = null; f.obs = new Set(); f.obsEl.innerHTML = ''; f.res.innerHTML = '';
  f.btns.forEach(b => b.classList.remove('on')); f.u = 420;
}

/* ---------- MODULE 21: chapter recap — the optical map ---------- */
const MAP = [
  ['LIGHT', 'travels in straight lines; drawn as rays', 'intro'],
  ['REFLECTION', 'light bounces off a mirror', 1],
  ['PLANE MIRROR', 'erect, same-size image', 1],
  ['SPHERICAL MIRRORS', 'part of a hollow sphere', 2],
  ['CONCAVE / CONVEX', 'curves inward / outward', 3],
  ['IMAGE FORMATION', 'concave: varies · convex: erect, diminished', 5],
  ['LAWS OF REFLECTION', 'i = r · all in one plane', 6],
  ['CONVERGE / DIVERGE', 'concave mirror converges · convex diverges', 7],
  ['LENSES', 'transparent, curved surfaces', 9],
  ['CONVEX / CONCAVE', 'thick middle / thick edges', 10],
  ['IMAGE FORMATION', 'convex: varies · concave: erect, diminished', 12],
  ['REAL-WORLD USES', 'torches, side mirrors, cameras, eyes…', 17]];
frame({
  mod: 21, kick: 'Chapter recap', title: 'The whole chapter, as one beam of light', mapTitle: 'Chapter recap: the optical map',
  sub: 'Follow the beam. Tap any stop to jump back to that experiment.',
  build(b, f) {
    f.c = canvas(b, 1792, 700, 'position:absolute;left:0;top:0');
    f.nodes = MAP.map((m, i) => {
      const row = Math.floor(i / 4), col = row % 2 ? 3 - (i % 4) : i % 4;
      return { x: 230 + col * 444, y: 110 + row * 240, t: m[0], s: m[1], go: m[2] };
    });
    pointer(f.c, {
      hover: p => f.nodes.some(n => Math.abs(p.x - n.x) < 190 && Math.abs(p.y - n.y) < 70),
      down: p => { const n = f.nodes.find(n => Math.abs(p.x - n.x) < 190 && Math.abs(p.y - n.y) < 70); if (n) go(App.frames.findIndex(fr => fr.mod === n.go)); return false; }
    });
    b.append(h('div', { class: 'abs card', style: 'left:0;right:0;top:712px;display:flex;gap:26px;align-items:center;padding:14px 24px' },
      h('div', { class: 'kick', style: 'flex:none' }, 'OUR SCIENTIFIC HERITAGE'),
      h('p', { style: 'font-size:22px', html: 'More than 800 years ago, in the time of <b>Bhāskara II</b>, astronomers watched the reflections of stars and planets in shallow bowls of water to measure their positions — using reflection long before its laws were written down.' })));
  },
  enter(f) { f.p = 0; },
  tick(f, dt, t) {
    f.p = Math.min(f.nodes.length + .5, (f.p || 0) + dt * 2.2);
    const x = begin(f.c), N = f.nodes;
    // path through the nodes
    const pts = []; N.forEach((n, i) => { pts.push([n.x, n.y]); });
    const seg = Math.floor(f.p), frac = f.p - seg;
    const lit = pts.slice(0, Math.min(N.length, seg + 1)); if (seg < N.length - 1) lit.push([lerp(pts[seg][0], pts[seg + 1][0], frac), lerp(pts[seg][1], pts[seg + 1][1], frac)]);
    x.save(); x.strokeStyle = 'rgba(255,255,255,.08)'; x.lineWidth = 3; path(x, pts); x.stroke(); x.restore();
    if (lit.length > 1) beam(x, lit, COL.ray, { flow: t * 140, w: 3.2, arrowAt: 120 });
    N.forEach((n, i) => {
      const on = i <= f.p, k = clamp(f.p - i, 0, 1);
      x.save(); x.fillStyle = on ? '#1a160c' : '#0e121c'; rrect(x, n.x - 180, n.y - 62, 360, 124, 20); x.fill();
      x.globalAlpha = .35 + .65 * k; x.strokeStyle = on ? `rgba(255,207,107,${.4 + .5 * k})` : 'rgba(160,180,220,.2)'; x.lineWidth = 2; x.stroke();
      x.restore();
      if (on) glow(x, n.x, n.y, 200, 'rgba(255,200,110,.12)', k);
      tag(x, n.t, n.x, n.y - 20, { size: 27, weight: 800, col: on ? '#fff' : COL.mute, bg: false, need: true });
      tag(x, n.s, n.x, n.y + 24, { size: 18, col: on ? '#e7d7b0' : COL.dim, bg: false, need: true });
      tag(x, String(i + 1).padStart(2, '0'), n.x - 158, n.y - 40, { size: 14, mono: true, col: COL.ray, bg: false, need: true });
    });
  }
});
COL.dim = '#6b778c';

boot();
